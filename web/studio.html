<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FormForge Studio</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------------------------------------------------------------
   FormForge Studio -- front end for the parametric definitions.
   Palette: humus and spore print. Chestnut is the only accent; moss
   carries "this will build", rust carries "this will not".
   --------------------------------------------------------------- */
:root {
  --paper:    #EBEDE6;
  --surface:  #F7F8F4;
  --sunken:   #E1E4DA;
  --line:     #D2D7C9;
  --ink:      #171D18;
  --muted:    #667062;
  --accent:   #8A5326;
  --accent-soft: #F0E3D5;
  --moss:     #4E7040;
  --moss-soft: #E2EBDC;
  --rust:     #A8402C;
  --rust-soft: #F5E0DB;
  --stage-a:  #E6E9E0;
  --stage-b:  #D6DBCC;
  --shadow:   0 1px 2px rgba(23, 29, 24, .06), 0 8px 24px rgba(23, 29, 24, .05);
  --radius:   10px;
  --mesh-light: #C9C6BE;
  --font-display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper:   #14170F;
    --surface: #1C201A;
    --sunken:  #101309;
    --line:    #2F3629;
    --ink:     #E8EBE1;
    --muted:   #96A08F;
    --accent:  #CE9155;
    --accent-soft: #33251A;
    --moss:    #8FB679;
    --moss-soft: #202B1C;
    --rust:    #E08267;
    --rust-soft: #33201B;
    --stage-a: #1E2219;
    --stage-b: #10130C;
    --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    --mesh-light: #B9B4A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper:   #14170F;
  --surface: #1C201A;
  --sunken:  #101309;
  --line:    #2F3629;
  --ink:     #E8EBE1;
  --muted:   #96A08F;
  --accent:  #CE9155;
  --accent-soft: #33251A;
  --moss:    #8FB679;
  --moss-soft: #202B1C;
  --rust:    #E08267;
  --rust-soft: #33201B;
  --stage-a: #1E2219;
  --stage-b: #10130C;
  --shadow:  0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  --mesh-light: #B9B4A8;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---- shell ---------------------------------------------------- */
.shell {
  min-height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr);
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px clamp(14px, 3vw, 28px) 24px;
  gap: 16px;
}
.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 14px;
}
.wordmark {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: clamp(26px, 3.4vw, 38px);
  letter-spacing: -0.015em;
  margin: 0;
  text-wrap: balance;
}
.wordmark span { color: var(--accent); }
.tagline {
  margin: 4px 0 0;
  color: var(--muted);
  max-width: 62ch;
}
.pipeline {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--muted);
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  align-items: center;
}
.pipeline b { color: var(--accent); font-weight: 500; }
.pipeline i { font-style: normal; opacity: .5; }

/* model tabs */
.tabs {
  display: flex;
  gap: 6px;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 3px;
}
.tab {
  border: 0;
  background: transparent;
  color: var(--muted);
  border-radius: 7px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background .12s ease, color .12s ease;
}
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] {
  background: var(--surface);
  color: var(--accent);
  font-weight: 600;
  box-shadow: 0 1px 2px rgba(0,0,0,.08);
}

/* ---- layout --------------------------------------------------- */
.studio {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 372px;
  gap: 16px;
  align-items: start;
}
@media (max-width: 980px) {
  .studio { grid-template-columns: minmax(0, 1fr); }
}

/* ---- stage ---------------------------------------------------- */
.stage {
  position: relative;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background:
    radial-gradient(120% 90% at 50% 8%, var(--stage-a) 0%, var(--stage-b) 100%);
  box-shadow: var(--shadow);
  overflow: hidden;
  min-height: 460px;
  height: min(78vh, 760px);
  display: grid;
}
@media (max-width: 980px) { .stage { height: 56vh; min-height: 380px; } }
#view { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
#view.dragging { cursor: grabbing; }

.readout {
  position: absolute;
  left: 14px;
  top: 14px;
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--muted);
  background: color-mix(in srgb, var(--surface) 82%, transparent);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 11px;
  backdrop-filter: blur(6px);
  font-variant-numeric: tabular-nums;
}
.readout b { color: var(--ink); font-weight: 500; }
.hint {
  position: absolute;
  right: 14px;
  bottom: 14px;
  font-size: 11px;
  color: var(--muted);
  letter-spacing: .02em;
}

/* ---- status --------------------------------------------------- */
.status {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 12px 14px;
  display: grid;
  gap: 8px;
  box-shadow: var(--shadow);
}
.status-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 600;
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--moss); flex: none; }
.status[data-state="blocked"] .dot { background: var(--rust); }
.status-note { color: var(--muted); font-size: 13px; margin: 0; }
.status ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.status li { color: var(--rust); font-size: 13px; }
.status li em { font-style: normal; color: var(--muted); }

/* ---- controls ------------------------------------------------- */
.controls {
  display: grid;
  gap: 14px;
  align-content: start;
}
@media (min-width: 981px) {
  .controls { max-height: min(78vh, 760px); overflow-y: auto; padding-right: 4px; }
}
.panel {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  box-shadow: var(--shadow);
  padding: 13px 14px 15px;
}
.panel > h2 {
  margin: 0 0 10px;
  font-family: var(--font-mono);
  font-size: 10.5px;
  font-weight: 500;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.panel > h2 span { text-transform: none; letter-spacing: 0; font-size: 11px; }

/* species chips */
.species {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: 7px;
}
.chip {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 8px;
  padding: 7px 6px 6px;
  display: grid;
  justify-items: center;
  gap: 3px;
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease, transform .12s ease;
}
.chip:hover { border-color: var(--accent); transform: translateY(-1px); }
.chip[aria-pressed="true"] {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.chip svg { display: block; }
.chip svg path { fill: var(--muted); }
.chip[aria-pressed="true"] svg path { fill: var(--accent); }
.chip small {
  font-size: 10.5px;
  letter-spacing: .02em;
  color: var(--muted);
  text-align: center;
}
.chip[aria-pressed="true"] small { color: var(--accent); font-weight: 600; }

/* sliders */
.field { display: grid; gap: 3px; padding: 6px 0; border-top: 1px solid var(--line); }
.field:first-of-type { border-top: 0; }
.field-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
}
.field label { font-size: 12.5px; }
.field output {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.field p { margin: 1px 0 3px; font-size: 11.5px; color: var(--muted); }
input[type="range"] {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  height: 18px;
  background: transparent;
  margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track {
  height: 3px; border-radius: 2px; background: var(--line);
}
input[type="range"]::-moz-range-track {
  height: 3px; border-radius: 2px; background: var(--line);
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface);
  margin-top: -5.5px; cursor: grab;
}
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--surface); cursor: grab;
}
.segmented { display: flex; gap: 5px; }
.segmented button {
  flex: 1;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--muted);
  border-radius: 7px;
  padding: 5px 4px;
  font-size: 12px;
  cursor: pointer;
  transition: border-color .12s ease, color .12s ease, background .12s ease;
}
.segmented button:hover { border-color: var(--accent); }
.segmented button[aria-pressed="true"] {
  border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600;
}

/* seed row */
.seedrow { display: flex; gap: 8px; align-items: center; }
.seedrow input[type="number"] {
  width: 92px;
  font-family: var(--font-mono);
  padding: 6px 8px;
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--paper);
}
.btn {
  border: 1px solid var(--line);
  background: var(--paper);
  border-radius: 8px;
  padding: 7px 12px;
  cursor: pointer;
  font-size: 13px;
  transition: border-color .12s ease, background .12s ease;
}
.btn:hover { border-color: var(--accent); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #FFF8F0;
  font-weight: 600;
}
:root[data-theme="dark"] .btn-primary { color: #1B1206; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .btn-primary { color: #1B1206; }
}
.btn-primary:hover { filter: brightness(1.06); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

/* export formats */
.formats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-bottom: 10px;
}
@media (max-width: 420px) { .formats { grid-template-columns: 1fr; } }
.format {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px 10px;
  background: var(--paper);
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.format h3 {
  margin: 0;
  font-size: 13px;
  font-weight: 600;
}
.format p { margin: 0 0 4px; font-size: 11.5px; color: var(--muted); }
.format .btn { width: 100%; margin-top: auto; }

/* command block */
.command {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: var(--sunken);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px 10px;
  color: var(--ink);
  overflow-x: auto;
  white-space: pre;
  margin: 0 0 9px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(8px);
  background: var(--ink);
  color: var(--paper);
  padding: 9px 16px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s ease, transform .18s ease;
  z-index: 20;
  max-width: min(90vw, 520px);
  text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.footnote { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
.footnote code { font-family: var(--font-mono); font-size: 11.5px; color: var(--ink); }
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="masthead">
    <div>
      <h1 class="wordmark">FormForge <span>Studio</span></h1>
      <p class="tagline" id="tagline"></p>
    </div>
    <div style="display:grid; gap:10px; justify-items:end;">
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="pipeline" id="pipeline"></div>
    </div>
  </header>

  <div class="studio">
    <div style="display:grid; gap:14px; min-width:0;">
      <section class="stage">
        <canvas id="view"></canvas>
        <div class="readout" id="readout"></div>
        <div class="hint">drag to orbit &middot; scroll to zoom</div>
      </section>
      <section class="status" id="status" data-state="ok">
        <div class="status-head"><span class="dot"></span><span id="status-title">Ready to build</span></div>
        <p class="status-note" id="status-note"></p>
        <ul id="status-list" hidden></ul>
      </section>
    </div>

    <aside class="controls">
      <section class="panel">
        <h2 id="preset-heading">Presets <span id="species-name"></span></h2>
        <div class="species" id="species"></div>
        <div class="seedrow" style="margin-top:11px;">
          <label for="seed" style="font-size:12.5px;">Seed</label>
          <input type="number" id="seed" min="0" max="9999" step="1" value="7">
          <button class="btn" id="shuffle" type="button">Shuffle</button>
          <button class="btn" id="reset" type="button">Reset</button>
        </div>
        <p class="footnote" id="seed-note"></p>
      </section>

      <div id="groups" style="display:grid; gap:14px;"></div>

      <section class="panel">
        <h2>Take it away</h2>
        <div class="formats">
          <div class="format">
            <h3>Print it</h3>
            <p>A mesh, ready to drop into a slicer.</p>
            <button class="btn btn-primary" id="export-stl" type="button">Download STL</button>
          </div>
          <div class="format">
            <h3>Edit it</h3>
            <p>One solid with real faces and edges &mdash; SolidWorks, Fusion, FreeCAD.</p>
            <button class="btn btn-primary" id="export-step" type="button">STEP script</button>
          </div>
        </div>
        <p class="footnote" id="export-note"></p>
        <pre class="command" id="command"></pre>
        <div class="btnrow">
          <button class="btn" id="copy-cmd" type="button">Copy command</button>
          <button class="btn" id="export-json" type="button">Parameters .json</button>
        </div>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
/* The four things that change when you switch models: the model itself,
   its schema, the parameter set on the sliders, and which preset that set
   started from. Everything below reads them; useModel(), at the bottom, is
   the only thing that writes them. */
let MODEL = null, SCHEMA = null, P = null, variant = null;
/* =================================================================
   1. The schema. Ranges are the template's own -- a slider that goes
      past them is a model the geometry has never been swept across.
   ================================================================= */
const MUSHROOM_SCHEMA = [
  {k:"cap_d_mm",     g:"cap", label:"Cap diameter",   min:30,   max:120, step:1,    v:62,   unit:"mm",
   note:"The circle the margin is cut from."},
  {k:"cap_h_mm",     g:"cap", label:"Cap height",     min:6,    max:60,  step:1,    v:26,   unit:"mm"},
  {k:"cap_fullness", g:"cap", label:"Fullness",       min:1,    max:6,   step:0.1,  v:2.2,  unit:"",
   note:"Low is conical, high is flat with a steep skirt."},
  {k:"cap_shoulder", g:"cap", label:"Shoulder",       min:0.3,  max:1.2, step:0.02, v:0.62, unit:"",
   note:"Low rounds the shoulder over. 2.0 / 0.5 is a hemisphere; 1.0 / 1.0 a cone."},
  {k:"cap_umbo_mm",  g:"cap", label:"Umbo",           min:0,    max:8,   step:0.5,  v:2.5,  unit:"mm",
   note:"The central boss. Solid, so it never thins the flesh."},
  {k:"cap_dish_mm",  g:"cap", label:"Dish",           min:0,    max:25,  step:1,    v:0,    unit:"mm",
   note:"Drops the centre below the rim. This is what makes a funnel."},
  {k:"cap_flesh_mm", g:"cap", label:"Flesh",          min:2.5,  max:12,  step:0.5,  v:6,    unit:"mm"},
  {k:"cap_margin_mm",g:"cap", label:"Margin",         min:0.8,  max:3,   step:0.1,  v:1.6,  unit:"mm"},
  {k:"cap_lobes",    g:"cap", label:"Lobes",          min:0,    max:9,   step:1,    v:5,    unit:""},
  {k:"cap_wave_mm",  g:"cap", label:"Wave depth",     min:0,    max:6,   step:0.2,  v:2,    unit:"mm",
   note:"How deep each lobe bites into the margin."},
  {k:"cap_tilt_deg", g:"cap", label:"Cap tilt",       min:0,    max:10,  step:1,    v:4,    unit:"°"},

  {k:"underside",    g:"underside", label:"Underside", choices:["gills","pores","smooth"], v:"gills",
   note:"Pores stand in for a bolete's tube layer as concentric grooving — a real pore is smaller than a 0.4 mm nozzle can print."},
  {k:"gill_count",   g:"underside", label:"Gills",     min:10, max:18,  step:1,    v:16,   unit:"",
   note:"Half-length lamellulae are added between them, so the margin carries twice this."},
  {k:"gill_t_mm",    g:"underside", label:"Blade thickness", min:0.8, max:2.2, step:0.1, v:1.3, unit:"mm",
   note:"1.3 mm is three perimeters at a 0.4 mm nozzle."},
  {k:"gill_depth_mm",g:"underside", label:"Gill depth", min:2,  max:9,  step:0.5,  v:5,    unit:"mm"},

  {k:"stem_h_mm",    g:"stem", label:"Stem height",   min:20,  max:110, step:1,    v:58,   unit:"mm"},
  {k:"stem_d_mm",    g:"stem", label:"Stem diameter", min:6,   max:30,  step:0.5,  v:14,   unit:"mm"},
  {k:"stem_taper",   g:"stem", label:"Taper",         min:-0.25, max:0.5, step:0.01, v:0.2, unit:"",
   note:"Negative widens upward, as a bolete does."},
  {k:"stem_bulb",    g:"stem", label:"Basal bulb",    min:0,   max:1.2, step:0.05, v:0.5,  unit:"",
   note:"Also the model's footprint on the plate."},
  {k:"stem_lean_mm", g:"stem", label:"Lean",          min:0,   max:15,  step:0.5,  v:6,    unit:"mm",
   note:"Nothing in a forest grows plumb."},
  {k:"stem_flare",   g:"stem", label:"Apex flare",    min:0,   max:0.6, step:0.05, v:0.25, unit:""},

  {k:"ring_style",   g:"ring", label:"Ring",          choices:["none","skirt","band"], v:"skirt"},
  {k:"ring_pos",     g:"ring", label:"Height up stem",min:0.35, max:0.9, step:0.02, v:0.72, unit:"",
   note:"Clamped down automatically so the ring always sits clear of the cap."},
  {k:"ring_w_mm",    g:"ring", label:"Ring width",    min:2,   max:10,  step:0.5,  v:5,    unit:"mm"},

  {k:"wart_count",   g:"warts", label:"Warts",        min:0,   max:26,  step:1,    v:20,   unit:""},
  {k:"wart_d_mm",    g:"warts", label:"Wart size",    min:1.5, max:7,   step:0.2,  v:4.4,  unit:"mm"},
  {k:"wart_flatten", g:"warts", label:"Relief",       min:0.15, max:0.9, step:0.05, v:0.45, unit:"",
   note:"How much of each sphere is left proud of the cap."}
];

/* Seven species: the same definition, seven sets of slider positions. */
const MUSHROOM_PRESETS = {

/* =================================================================
   2. The geometry, ported from the template's build123d source.
      hash01 is the same expression, so the scatter you see here is
      the scatter the kernel builds.
   ================================================================= */
const TAU = Math.PI * 2;
function hash01(i, salt, seed) {
  const x = Math.sin((i + 1) * 12.9898 + (seed + 1) * 78.233 + salt * 37.719) * 43758.5453;
  return x - Math.floor(x);
}
function domeZ(s, p) {
  const t = Math.min(1, Math.max(0, s));
  return p.cap_h_mm * Math.pow(1 - Math.pow(t, p.cap_fullness), p.cap_shoulder)
       - p.cap_dish_mm * (1 - t * t);
}
function crownZ(s, p) {
  return domeZ(s, p) + p.cap_umbo_mm * Math.exp(-Math.pow(s / 0.24, 2));
}
function fleshAt(s, p) {
  return p.cap_flesh_mm * Math.pow(1 - Math.min(1, s), 0.7) + p.cap_margin_mm;
}
function resample(points, count) {
  const run = [0];
  for (let i = 1; i < points.length; i++) {
    run.push(run[i - 1] + Math.hypot(points[i][0] - points[i-1][0], points[i][1] - points[i-1][1]));
  }
  const total = run[run.length - 1] || 1;
  const out = [];
  let j = 0;
  for (let k = 0; k <= count; k++) {
    const target = total * k / count;
    while (j < run.length - 2 && run[j + 1] < target) j++;
    const span = run[j + 1] - run[j];
    const f = span <= 0 ? 0 : (target - run[j]) / span;
    out.push([
      points[j][0] + (points[j+1][0] - points[j][0]) * f,
      points[j][1] + (points[j+1][1] - points[j][1]) * f
    ]);
  }
  return out;
}
function interpZ(points, x) {
  for (let i = 0; i < points.length - 1; i++) {
    const [x0, z0] = points[i], [x1, z1] = points[i+1];
    if (x0 <= x && x <= x1 && x1 > x0) return z0 + (z1 - z0) * (x - x0) / (x1 - x0);
  }
  return x > points[points.length-1][0] ? points[points.length-1][1] : points[0][1];
}

/* The cap's meridian: crown curve out to the rim, then the underside
   offset along the dome's own normal back to the axis. */
function capProfile(p) {
  const R = p.cap_d_mm / 2, STEPS = 30, DENSE = 260;
  const dome = [], crown = [];
  for (let i = 0; i <= DENSE; i++) {
    const s = i / DENSE;
    dome.push([R * s, domeZ(s, p)]);
    crown.push([R * s, crownZ(s, p)]);
  }
  const top = resample(crown, STEPS);
  top[0] = [0, crown[0][1]];
  top[top.length - 1] = crown[crown.length - 1];

  const offsets = [];
  const eps = R * 1e-3;
  for (const [x] of resample(dome, STEPS)) {
    const s = Math.min(1, x / R);
    const dz = domeZ(Math.min(1, (x + eps) / R), p) - domeZ(Math.max(0, (x - eps) / R), p);
    const len = Math.hypot(2 * eps, dz) || 1;
    const t = fleshAt(s, p);
    offsets.push([x + dz / len * t, domeZ(s, p) - 2 * eps / len * t]);
  }
  const inner = [];
  for (const pt of offsets) {
    if (pt[0] <= 0) continue;
    if (inner.length && pt[0] <= inner[inner.length-1][0] + R * 1e-3) continue;
    inner.push(pt);
  }
  if (inner.length < 2) inner.push([R * 0.5, domeZ(0.5, p) - fleshAt(0.5, p)]);
  const [x0, z0] = inner[0], [x1, z1] = inner[1];
  const axisZ = z0 - (z1 - z0) * x0 / Math.max(x1 - x0, 1e-6);
  inner.unshift([0, Math.min(axisZ, domeZ(0, p) - Math.max(0.5, fleshAt(0, p) * 0.35))]);
  return {top, inner, R};
}

function gillZone(p, prof) {
  const stemR = p.stem_d_mm / 2;
  const rIn = stemR * 1.25 + 1.5;
  const rOut = Math.min(p.cap_d_mm / 2 - p.cap_margin_mm * 1.5 - p.cap_wave_mm,
                        prof.inner[prof.inner.length - 1][0] - 1);
  const on = p.underside === "gills" && rOut > rIn + 4;
  const zIn = interpZ(prof.inner, rIn), zOut = interpZ(prof.inner, rOut);
  const roof = r => zIn + (zOut - zIn) * (r - rIn) / Math.max(rOut - rIn, 1e-6);
  return {rIn, rOut, on, roof};
}

/* --- mesh plumbing ------------------------------------------------ */
function Builder() {
  this.pos = [];
}
/* Signed volume of everything a builder holds: negative means the shell
   is wound inside out, which a slicer reads as a hole rather than a
   solid. Each part is checked and flipped as it is merged. */
Builder.prototype.volume = function () {
  let v = 0;
  const p = this.pos;
  for (let i = 0; i < p.length; i += 9) {
    v += (p[i] * (p[i+4] * p[i+8] - p[i+5] * p[i+7])
        - p[i+1] * (p[i+3] * p[i+8] - p[i+5] * p[i+6])
        + p[i+2] * (p[i+3] * p[i+7] - p[i+4] * p[i+6])) / 6;
  }
  return v;
};
Builder.prototype.merge = function (other) {
  const p = other.pos;
  if (other.volume() < 0) {
    for (let i = 0; i < p.length; i += 9) {
      this.pos.push(p[i], p[i+1], p[i+2], p[i+6], p[i+7], p[i+8], p[i+3], p[i+4], p[i+5]);
    }
  } else {
    for (let i = 0; i < p.length; i++) this.pos.push(p[i]);
  }
  return other.volume();
};
Builder.prototype.tri = function (a, b, c) {
  this.pos.push(a[0], a[1], a[2], b[0], b[1], b[2], c[0], c[1], c[2]);
};
Builder.prototype.quad = function (a, b, c, d) { this.tri(a, b, c); this.tri(a, c, d); };

/* Revolve a meridian polyline, clamping each vertex to the trim cone
   that cuts the lobes -- the same cone the template intersects with. */
function revolve(build, profile, segments, p, xform) {
  const lobes = Math.round(p.cap_lobes), wave = p.cap_wave_mm;
  const trim = wave > 0 && lobes > 0;
  const TRIM = Math.max(0.6, p.cap_margin_mm * 0.4);
  const RISE = 1 / Math.tan(32 * Math.PI / 180);
  const R = p.cap_d_mm / 2;
  const ring = [];
  for (let j = 0; j < segments; j++) {
    const a = TAU * j / segments;
    let limit = Infinity;
    if (trim) {
      const lobe = 0.5 - 0.5 * Math.cos(lobes * a);
      const depth = wave * (0.7 + 0.6 * hash01(Math.floor(lobes * a / TAU), 3, p.seed));
      limit = R - TRIM - depth * lobe;
    }
    ring.push([Math.cos(a), Math.sin(a), limit]);
  }
  const grid = profile.map(([r, z]) =>
    ring.map(([ca, sa, limit]) => {
      const rr = trim ? Math.min(r, limit + RISE * z) : r;
      return xform([rr * ca, rr * sa, z]);
    }));
  for (let i = 0; i < profile.length - 1; i++) {
    for (let j = 0; j < segments; j++) {
      const k = (j + 1) % segments;
      const a = grid[i][j], b = grid[i][k], c = grid[i+1][k], d = grid[i+1][j];
      if (profile[i][0] < 1e-6) { build.tri(a, c, d); }
      else if (profile[i+1][0] < 1e-6) { build.tri(a, b, c); }
      else build.quad(a, b, c, d);
    }
  }
}

function prism(build, poly, half, xform) {
  const front = poly.map(([r, z]) => xform([r, half, z]));
  const back = poly.map(([r, z]) => xform([r, -half, z]));
  for (let i = 1; i < poly.length - 1; i++) {
    build.tri(front[0], front[i], front[i+1]);
    build.tri(back[0], back[i+1], back[i]);
  }
  for (let i = 0; i < poly.length; i++) {
    const j = (i + 1) % poly.length;
    build.quad(front[i], back[i], back[j], front[j]);
  }
}

function sphere(build, cx, cy, cz, r, rings, segs) {
  const pt = (i, j) => {
    const phi = Math.PI * i / rings, th = TAU * j / segs;
    return [cx + r * Math.sin(phi) * Math.cos(th), cy + r * Math.sin(phi) * Math.sin(th), cz + r * Math.cos(phi)];
  };
  for (let i = 0; i < rings; i++) {
    for (let j = 0; j < segs; j++) {
      const a = pt(i, j), b = pt(i, j+1), c = pt(i+1, j+1), d = pt(i+1, j);
      if (i === 0) build.tri(a, c, d);
      else if (i === rings - 1) build.tri(a, b, c);
      else build.quad(a, b, c, d);
    }
  }
}

/* --- the model ----------------------------------------------------- */
function mushroomMesh(p, quality) {
  const seg = quality === "export" ? 96 : 72;
  const build = new Builder();
  let material_mm3 = 0;
  const part = () => new Builder();
  const prof = capProfile(p);
  const zone = gillZone(p, prof);
  const capZ = p.stem_h_mm - p.cap_h_mm + p.cap_flesh_mm * 0.7;
  const tilt = p.cap_tilt_deg * Math.PI / 180;
  const place = ([x, y, z]) => [
    x * Math.cos(tilt) + z * Math.sin(tilt) + p.stem_lean_mm,
    y,
    -x * Math.sin(tilt) + z * Math.cos(tilt) + capZ
  ];

  /* underside, with the gill roof flattened to a cone or corrugated
     into pore rings */
  let under = prof.inner.slice();
  if (zone.on) {
    const PAD = 2;
    under = under.filter(pt => pt[0] < zone.rIn - PAD || pt[0] > zone.rOut + PAD);
    const head = under.filter(pt => pt[0] < zone.rIn - PAD);
    const tail = under.filter(pt => pt[0] > zone.rOut + PAD);
    under = head.concat([[zone.rIn - PAD, zone.roof(zone.rIn - PAD)],
                         [zone.rOut + PAD, zone.roof(zone.rOut + PAD)]], tail);
  } else if (p.underside === "pores" && zone.rOut > zone.rIn + 4) {
    const head = prof.inner.filter(pt => pt[0] < zone.rIn);
    const tail = prof.inner.filter(pt => pt[0] > zone.rOut);
    const mid = [];
    const depth = Math.min(p.gill_depth_mm * 0.5, 2.5);
    for (let r = zone.rIn; r <= zone.rOut; r += 0.45) {
      const wave = 0.5 - 0.5 * Math.cos(TAU * (r - zone.rIn) / 3);
      mid.push([r, interpZ(prof.inner, r) - depth * wave]);
    }
    under = head.concat(mid, tail);
  }
  const meridian = prof.top.concat(under.slice().reverse());
  const capPart = part();
  revolve(capPart, meridian, seg, p, place);
  material_mm3 += Math.abs(build.merge(capPart));

  /* gill blades: full-length gills alternating with lamellulae */
  if (zone.on) {
    const d = p.gill_depth_mm, half = p.gill_t_mm / 2;
    const bladePoly = r0 => {
      const mid = (r0 + zone.rOut) / 2;
      return [
        [r0, zone.roof(r0) + 0.8],
        [zone.rOut, zone.roof(zone.rOut) + 0.8],
        [zone.rOut, zone.roof(zone.rOut) - d * 0.15],
        [mid, zone.roof(mid) - d],
        [r0, zone.roof(r0) - d * 0.3]
      ];
    };
    const long = bladePoly(zone.rIn), short = bladePoly((zone.rIn + zone.rOut) / 2);
    const n = Math.round(p.gill_count);
    for (let k = 0; k < n; k++) {
      for (const [poly, off] of [[long, 0], [short, 0.5]]) {
        const a = TAU * (k + off) / n, ca = Math.cos(a), sa = Math.sin(a);
        const blade = part();
        prism(blade, poly, half, ([r, y, z]) => place([r * ca - y * sa, r * sa + y * ca, z]));
        material_mm3 += Math.abs(build.merge(blade)) * 0.55;
      }
    }
  }

  /* stem: circles lofted along a leaning axis */
  const SECTIONS = 26, stemR = p.stem_d_mm / 2;
  const rings = [];
  for (let i = 0; i <= SECTIONS; i++) {
    const t = i / SECTIONS;
    const r = stemR * (1 - p.stem_taper * t)
            * (1 + p.stem_bulb * Math.exp(-Math.pow(t / 0.18, 2)))
            * (1 + p.stem_flare * Math.pow(t, 6));
    rings.push([r, p.stem_h_mm * t, p.stem_lean_mm * Math.pow(t, 1.7)]);
  }
  const stemGrid = rings.map(([r, z, dx]) => {
    const row = [];
    for (let j = 0; j < seg; j++) {
      const a = TAU * j / seg;
      row.push([dx + r * Math.cos(a), r * Math.sin(a), z]);
    }
    return row;
  });
  const stemPart = part();
  for (let i = 0; i < stemGrid.length - 1; i++) {
    for (let j = 0; j < seg; j++) {
      const k = (j + 1) % seg;
      stemPart.quad(stemGrid[i][j], stemGrid[i][k], stemGrid[i+1][k], stemGrid[i+1][j]);
    }
  }
  for (let j = 0; j < seg; j++) {
    const k = (j + 1) % seg;
    stemPart.tri([rings[0][2], 0, 0], stemGrid[0][k], stemGrid[0][j]);
    const topRow = stemGrid[stemGrid.length - 1];
    stemPart.tri([rings[rings.length-1][2], 0, p.stem_h_mm], topRow[j], topRow[k]);
  }
  material_mm3 += Math.abs(build.merge(stemPart)) * 0.72;

  /* the veil ring, clamped below the cap so it is never swallowed */
  if (p.ring_style !== "none") {
    const t = Math.max(0.12, Math.min(p.ring_pos, (capZ - p.ring_w_mm * 0.6) / p.stem_h_mm));
    const z = p.stem_h_mm * t;
    const r0 = stemR * (1 - p.stem_taper * t) * 0.85;
    const droop = p.ring_style === "skirt" ? 0.45 : 0.08;
    const len = Math.hypot(1, droop), dr = 1 / len, dz = -droop / len;
    const thick = Math.max(1.4, p.ring_w_mm * 0.28);
    const nr = -dz * thick / 2, nz = dr * thick / 2;
    const tipR = r0 + dr * p.ring_w_mm, tipZ = z + dz * p.ring_w_mm;
    const dx = p.stem_lean_mm * Math.pow(t, 1.7);
    const ringPart = part();
    revolve(ringPart, [[r0 + nr, z + nz], [tipR + nr, tipZ + nz],
                       [tipR - nr, tipZ - nz], [r0 - nr, z - nz], [r0 + nr, z + nz]],
            seg, Object.assign({}, p, {cap_wave_mm: 0}), ([x, y, zz]) => [x + dx, y, zz]);
    material_mm3 += Math.abs(build.merge(ringPart)) * 0.8;
  }

  /* warts: spheres sunk into the crown */
  const R = p.cap_d_mm / 2;
  const wr = quality === "export" ? [12, 16] : [10, 12];
  for (let k = 0; k < Math.round(p.wart_count); k++) {
    const s = Math.sqrt(hash01(k, 1, p.seed)) * 0.85;
    const angle = TAU * hash01(k, 2, p.seed);
    let r = Math.max(0.7, p.wart_d_mm / 2 * (0.6 + 0.8 * hash01(k, 5, p.seed)));
    if (r * (1 - p.wart_flatten) > fleshAt(s, p) * 0.5) {
      r = fleshAt(s, p) * 0.5 / Math.max(1 - p.wart_flatten, 0.05);
    }
    const c = place([R * s * Math.cos(angle), R * s * Math.sin(angle),
                     crownZ(s, p) - r * (1 - p.wart_flatten)]);
    const wart = part();
    sphere(wart, c[0], c[1], c[2], r, wr[0], wr[1]);
    material_mm3 += Math.abs(build.merge(wart)) * p.wart_flatten;
  }
  const out = new Float32Array(build.pos);
  out.materialVolume = material_mm3;
  return out;
}

function templateSource() {
  return atob(MODEL.sourceB64);
}
/* Bind the sliders into the script the same way the CLI does: rewrite the
   module-level constant, leave every comment in place. */
function boundScript(p) {
  let out = templateSource();
  const values = paramsOnly();
  for (const key of Object.keys(values)) {
    const name = key.toUpperCase();
    const value = typeof values[key] === "string" ? JSON.stringify(values[key]) : values[key];
    const pattern = new RegExp("^" + name + " = .*$", "m");
    if (!pattern.test(out)) continue;
    out = out.replace(pattern, name + " = " + value);
  }
  return [
    "# " + MODEL.labels[variant] + " " + MODEL.noun + ", seed " + p.seed +
      " -- built in FormForge Studio.",
    "#",
    "# This is the " + MODEL.templateId + " template with your slider positions bound in.",
    "# It needs no repository and no server, only the CAD kernel:",
    "#",
    "#     pip install build123d",
    "#     python " + MODEL.noun + ".py",
    "#",
    "# It writes " + MODEL.noun + ".step -- one solid with analytic faces, which",
    "# opens in SolidWorks, Fusion or FreeCAD with its edges and faces intact --",
    "# and " + MODEL.noun + ".stl beside it. Every dimension below is still a named",
    "# constant: change one, run it again, and you have a different " + MODEL.noun + ".",
    "",
    out.trimEnd(),
    "",
    'export_step(result, "' + MODEL.noun + '.step")',
    'export_stl(result, "' + MODEL.noun + '.stl", tolerance=0.05, angular_tolerance=0.2)',
    'print("wrote ' + MODEL.noun + '.step and ' + MODEL.noun + '.stl")',
    ""
  ].join("\n");
}

/* =================================================================
   2c. The rules the mushroom template states as preconditions, and
       the proportion and feasibility nodes the generator runs after
       the jitter. Same numbers as the Python, checked here so you
       find out before the kernel does.
   ================================================================= */
function mushroomCheck(p) {
  const out = [];
  if (!(p.stem_h_mm >= p.cap_h_mm * 0.5 + 12))
    out.push(["The stem is too short for the cap it carries.", "raise the stem above " + (p.cap_h_mm * 0.5 + 12).toFixed(0) + " mm"]);
  if (!(p.cap_flesh_mm + p.cap_margin_mm < p.cap_h_mm))
    out.push(["The flesh is thicker than the cap is tall.", "thin the flesh or raise the cap"]);
  if (p.underside !== "smooth") {
    const room = p.cap_d_mm / 2 - p.cap_margin_mm * 1.5 - p.cap_wave_mm - (p.stem_d_mm * 0.625 + 1.5);
    if (!(room > 5)) out.push(["No annulus left between the stem and the margin for a gill or pore layer.", "narrow the stem or widen the cap"]);
  }
  if (p.underside === "gills" && !(p.gill_depth_mm <= p.cap_flesh_mm + 3))
    out.push(["The gills hang deeper than the flesh is thick.", "shallower gills, or more flesh"]);
  if (p.ring_style !== "none" && !(p.stem_h_mm - p.cap_h_mm + p.cap_flesh_mm * 0.7 > p.ring_w_mm + 4))
    out.push(["No stem left below the cap for the ring to sit on.", "raise the stem or narrow the ring"]);
  if (!(p.stem_d_mm < p.cap_d_mm * 0.62))
    out.push(["The stem is too fat for the cap.", "narrow the stem below " + (p.cap_d_mm * 0.62).toFixed(0) + " mm"]);
  if (!(p.stem_lean_mm * 0.75 < p.stem_d_mm / 2 * (1 + p.stem_bulb)))
    out.push(["It topples: the cap leans past its own footprint.", "widen the basal bulb, or reduce the lean"]);
  return out;
}

/* Shuffle: the proportion and feasibility nodes, as the generator runs them. */
function mushroomShuffle(next, base, seed) {
  const capScale = next.cap_d_mm / base.cap_d_mm;
  next.stem_h_mm = base.stem_h_mm * capScale;
  next.stem_d_mm = base.stem_d_mm * capScale;
  next.gill_count = Math.round(Math.min(next.cap_d_mm * 0.26, 1000 / next.cap_d_mm));
  next.gill_depth_mm = Math.min(next.cap_flesh_mm + 2, next.cap_d_mm * 0.11);
  next.ring_w_mm = next.stem_d_mm * 0.42;
  if (base.wart_count)
    next.wart_count = Math.round(Math.min(next.cap_d_mm * next.cap_d_mm * 0.004, 1600 / next.cap_d_mm));

  next.cap_h_mm = Math.max(next.cap_h_mm, next.cap_flesh_mm + next.cap_margin_mm + 1);
  next.stem_h_mm = Math.max(next.stem_h_mm, next.cap_h_mm * 0.5 + 13);
  next.stem_d_mm = Math.min(next.stem_d_mm, next.cap_d_mm * 0.55);
  if (next.underside !== "smooth") {
    const room = next.cap_d_mm / 2 - next.cap_margin_mm * 1.5 - next.cap_wave_mm;
    next.stem_d_mm = Math.min(next.stem_d_mm, (room - 8.5) / 0.625);
  }
  const foot = next.stem_d_mm / 2 * (1 + next.stem_bulb);
  if (next.stem_lean_mm * 0.75 >= foot) {
    next.stem_bulb = Math.min(1.2, Math.max(next.stem_bulb,
      next.stem_lean_mm * 0.825 / Math.max(next.stem_d_mm / 2, 1e-6) - 1));
    next.stem_lean_mm = Math.min(next.stem_lean_mm,
      next.stem_d_mm / 2 * (1 + next.stem_bulb) / 0.75 * 0.92);
  }
  if (next.ring_style !== "none") {
    next.stem_h_mm = Math.max(next.stem_h_mm,
      next.cap_h_mm - next.cap_flesh_mm * 0.7 + next.ring_w_mm + 6);
  }
  return next;
}

/* The silhouette: a Fritsch-Carlson monotone cubic through four control
   diameters. A natural cubic bulges past the widest of them and puts an
   undercut where the slider said straight shoulder. Both vases turn their
   profile on this, so it lives here rather than in either of them. */
function monotoneProfile(cx, cy, shoulder, height) {
  /* Any number of control points: the vases hand it four, the candle holder
     three -- base, belly, rim -- because the belly is always its widest. */
  const n = cx.length - 1;
  const d = [];
  for (let i = 0; i < n; i++) d.push((cy[i + 1] - cy[i]) / Math.max(cx[i + 1] - cx[i], 1e-6));
  const m = [d[0]];
  for (let i = 1; i < n; i++) m.push(0);
  m.push(d[n - 1]);
  for (let i = 1; i < n; i++) {
    if (d[i - 1] * d[i] <= 0) { m[i] = 0; continue; }
    const w1 = 2 * (cx[i + 1] - cx[i]) + (cx[i] - cx[i - 1]);
    const w2 = (cx[i + 1] - cx[i]) + 2 * (cx[i] - cx[i - 1]);
    m[i] = (w1 + w2) / (w1 / d[i - 1] + w2 / d[i]);
  }
  const radiusAt = t => {
    t = Math.min(1, Math.max(0, t));
    for (let i = 0; i < n; i++) {
      if (cx[i] <= t && t <= cx[i + 1]) {
        const h = cx[i + 1] - cx[i];
        const s = h <= 0 ? 0 : (t - cx[i]) / h;
        const m0 = m[i] * h * shoulder * 2, m1 = m[i + 1] * h * shoulder * 2;
        return (2 * s ** 3 - 3 * s ** 2 + 1) * cy[i]
             + (s ** 3 - 2 * s ** 2 + s) * m0
             + (-2 * s ** 3 + 3 * s ** 2) * cy[i + 1]
             + (s ** 3 - s ** 2) * m1;
      }
    }
    return cy[n];
  };
  const slopeAt = t => {
    const step = 1e-3;
    const lo = Math.max(0, t - step), hi = Math.min(1, t + step);
    return (radiusAt(hi) - radiusAt(lo)) / ((hi - lo) * height);
  };
  return {radiusAt, slopeAt};
}
function vaseProfile(p) {
  return monotoneProfile([0, p.mid_pos, p.neck_pos, 1],
    [p.base_d_mm / 2, p.mid_d_mm / 2, p.neck_d_mm / 2, p.rim_d_mm / 2],
    p.shoulder, p.height_mm);
}

function vaseFacet(p, angle) {
  if (p.facets < 3) return 1;
  const step = TAU / p.facets;
  const local = ((angle % step) + step) % step - step / 2;
  const polygon = Math.cos(Math.PI / p.facets) / Math.cos(local);
  return polygon + (1 - polygon) * p.facet_round;
}
function vaseFlute(p, angle) {
  if (p.lobes < 1 || p.lobe_mm <= 0) return 0;
  let wave = Math.cos(p.lobes * angle);
  if (p.flute_sharp > 0) {
    const sharp = Math.sign(wave) * Math.abs(wave) ** (1 / (1 + 1.5 * p.flute_sharp));
    wave = wave * (1 - p.flute_sharp) + sharp * p.flute_sharp;
  }
  return p.lobe_mm * wave;
}
function vaseRipple(p, t) {
  if (p.ripples < 1 || p.ripple_mm <= 0) return 0;
  return p.ripple_mm * Math.sin(TAU * p.ripples * t);
}

function vaseResolution(p, quality) {
  const sharp = p.facets >= 3 && p.facet_round < 0.15 && p.lobes < 1;
  let points = sharp ? p.facets : Math.min(120, Math.max(48, p.lobes * 6, p.facets * 8));
  const spiral = Math.abs(p.twist_deg) * Math.max(p.lobes, p.facets, 1) / 60;
  let sections = Math.min(96, Math.max(40, p.ripples * 6, spiral));
  if (quality !== "export") {
    sections = Math.min(sections, 56);
    if (!sharp) points = Math.min(points, 84);
  }
  return {points: Math.round(points), sections: Math.round(sections), sharp};
}

/* A vase is a wall, so the mesh is one closed shell -- outer skin, rim,
   inner skin, floor -- rather than a solid with a cavity cut out of it.
   That makes the volume readout exact rather than an estimate. */
function vaseMesh(p, quality) {
  const {points, sections} = vaseResolution(p, quality);
  const prof = vaseProfile(p);
  const build = new Builder();

  const ring = (t, inset, z) => {
    const spin = (p.twist_deg * Math.PI / 180) * t;
    const out = [];
    for (let j = 0; j < points; j++) {
      const angle = TAU * j / points;
      const r = Math.max(0.4,
        prof.radiusAt(t) * vaseFacet(p, angle + spin) + vaseFlute(p, angle + spin)
        + vaseRipple(p, t) - inset);
      out.push([r * Math.cos(angle), r * Math.sin(angle), z]);
    }
    return out;
  };
  const wallAt = t => {
    const slope = prof.slopeAt(t);
    let wall = p.wall_mm * Math.min(2.5, Math.sqrt(1 + slope * slope));
    if (p.rim_band_mm > 0) {
      const nearRim = Math.max(0, (t * p.height_mm - (p.height_mm - 10)) / 10);
      wall += p.rim_band_mm * Math.min(1, nearRim);
    }
    return wall;
  };

  const outer = [], inner = [];
  for (let i = 0; i <= sections; i++) {
    const t = i / sections;
    outer.push(ring(t, 0, p.height_mm * t));
    const zi = p.base_mm + (p.height_mm - p.base_mm) * t;
    const ti = Math.min(1, zi / p.height_mm);
    inner.push(ring(ti, wallAt(ti), zi));
  }

  /* The kernel's bands are ruled, so every point between two sections is a
     straight blend of them -- which means extra rows cost nothing in
     accuracy and are exactly on the surface the kernel builds. They are
     worth having: one quad spanning a 7 degree twist triangulates into a
     visible chevron, and the vase looks stepped where the solid is not. */
  const rows = Math.max(1, Math.min(4, Math.round(160 / sections)));
  const dense = rings => {
    if (rows === 1) return rings;
    const out = [];
    for (let i = 0; i < rings.length - 1; i++) {
      for (let s = 0; s < rows; s++) {
        const f = s / rows;
        out.push(rings[i].map((q, j) => [
          q[0] + (rings[i + 1][j][0] - q[0]) * f,
          q[1] + (rings[i + 1][j][1] - q[1]) * f,
          q[2] + (rings[i + 1][j][2] - q[2]) * f
        ]));
      }
    }
    out.push(rings[rings.length - 1]);
    return out;
  };
  const outerRows = dense(outer), innerRows = dense(inner);

  for (let i = 0; i < outerRows.length - 1; i++) {
    for (let j = 0; j < points; j++) {
      const k = (j + 1) % points;
      build.quad(outerRows[i][j], outerRows[i][k], outerRows[i + 1][k], outerRows[i + 1][j]);
      build.quad(innerRows[i][k], innerRows[i][j], innerRows[i + 1][j], innerRows[i + 1][k]);
    }
  }
  // rim: the annulus that closes outer to inner at the top
  const topOuter = outer[sections], topInner = inner[sections];
  for (let j = 0; j < points; j++) {
    const k = (j + 1) % points;
    build.quad(topOuter[j], topOuter[k], topInner[k], topInner[j]);
  }
  // floor: a disc under the outside, and the cavity's floor above it
  const baseRing = outer[0], cavityRing = inner[0];
  const outerCentre = [0, 0, 0], innerCentre = [0, 0, p.base_mm];
  for (let j = 0; j < points; j++) {
    const k = (j + 1) % points;
    build.tri(outerCentre, baseRing[k], baseRing[j]);
    build.tri(innerCentre, cavityRing[j], cavityRing[k]);
  }

  const positions = new Float32Array(build.pos);
  positions.materialVolume = Math.abs(build.volume());
  return positions;
}

/* The template's preconditions, checked as you drag. */
function vaseCheck(p) {
  const out = [];
  if (!(p.neck_pos > p.mid_pos + 0.05))
    out.push(["The neck sits at or below the belly.", "raise the neck, or drop the belly"]);
  if (!(p.base_mm < p.height_mm * 0.3))
    out.push(["The floor is a third of the whole vase.", "thin the floor"]);
  if (!(Math.min(p.base_d_mm, p.mid_d_mm, p.neck_d_mm, p.rim_d_mm) > p.wall_mm * 2 + 6))
    out.push(["The cavity does not fit inside the narrowest diameter.",
              "widen that diameter, or thin the wall"]);
  if (p.lobes >= 1 && !(p.neck_d_mm / 2 - p.lobe_mm - p.wall_mm * 2 > 3))
    out.push(["The flutes cut deeper than the neck has wall to spare.",
              "shallower flutes, or a wider neck"]);
  if (!(Math.abs(p.twist_deg) * Math.max(p.lobes, p.facets, 1) <= 3600))
    out.push(["Twist times detail is past what the kernel can afford.",
              "less twist, or fewer flutes"]);
  const spans = [
    [p.mid_d_mm - p.base_d_mm, p.mid_pos, "belly"],
    [p.neck_d_mm - p.mid_d_mm, p.neck_pos - p.mid_pos, "neck"],
    [p.rim_d_mm - p.neck_d_mm, 1 - p.neck_pos, "rim"]
  ];
  for (const [delta, span, where] of spans) {
    if (Math.abs(delta) / 2 > span * p.height_mm) {
      out.push([`The ${where} turns faster than 45°, which needs support.`,
                delta > 0 ? "flare it less, or raise it further up" : "close it in more gently"]);
      break;
    }
  }
  return out;
}

/* Chip icon: the outer envelope of that style, so the icon is the vase. */
function vaseSilhouette(preset) {
  const p = Object.assign({}, VASE_DEFAULTS, preset);
  const prof = vaseProfile(p);
  const right = [];
  for (let i = 0; i <= 40; i++) {
    const t = i / 40;
    right.push([prof.radiusAt(t), p.height_mm * t]);
  }
  const maxR = Math.max(...right.map(q => q[0])) || 1;
  const k = Math.min(12 / maxR, 27 / p.height_mm);
  const put = ([r, z]) => `${(16 + r * k).toFixed(1)},${(30 - z * k).toFixed(1)}`;
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M` +
    right.map(put).join("L") + "L" +
    right.slice().reverse().map(([r, z]) =>
      `${(16 - r * k).toFixed(1)},${(30 - z * k).toFixed(1)}`).join("L") +
    `Z"/></svg>`;
}

/* Shuffle: the proportion and feasibility nodes, as the generator runs them. */
function vaseShuffle(next, base, seed) {
  const height = next.height_mm;
  const reference = base.height_mm;
  ["base_d_mm", "mid_d_mm", "neck_d_mm", "rim_d_mm"].forEach(name => {
    const wobble = 1 + 0.08 * (hash01(name.length, name.charCodeAt(1), seed) * 2 - 1);
    next[name] = height * (base[name] / reference) * wobble;
  });
  if (base.ripples) next.ripples = Math.max(3, Math.round(height / (reference / base.ripples)));
  if (base.lobes) next.lobes = Math.max(4, Math.round(next.mid_d_mm / (base.mid_d_mm / base.lobes)));

  next.mid_pos = Math.min(Math.max(next.mid_pos, 0.16), 0.66);
  next.neck_pos = Math.min(Math.max(next.neck_pos, next.mid_pos + 0.08), 0.95);
  const floor = next.wall_mm * 2 + 7;
  ["base_d_mm", "mid_d_mm", "neck_d_mm", "rim_d_mm"].forEach(n => {
    next[n] = Math.max(next[n], floor);
  });
  // 45 degrees, in either direction, walked bottom-up
  [["base_d_mm", "mid_d_mm", next.mid_pos],
   ["mid_d_mm", "neck_d_mm", next.neck_pos - next.mid_pos],
   ["neck_d_mm", "rim_d_mm", 1 - next.neck_pos]].forEach(([lower, upper, span]) => {
    const room = span * next.height_mm * 2 * 0.96;
    const delta = next[upper] - next[lower];
    if (Math.abs(delta) > room) next[upper] = next[lower] + (delta > 0 ? room : -room);
    next[upper] = Math.max(next[upper], floor);
  });
  if (next.lobes >= 1) {
    next.lobe_mm = Math.max(0, Math.min(next.lobe_mm, next.neck_d_mm / 2 - next.wall_mm * 2 - 3.5));
    if (next.lobe_mm < 0.4) next.lobes = 0;
  }
  const detail = Math.max(next.lobes, next.facets, 1);
  if (Math.abs(next.twist_deg) * detail > 3400) {
    next.twist_deg = Math.round(3400 / detail) * (next.twist_deg >= 0 ? 1 : -1);
  }
  next.base_mm = Math.min(next.base_mm, next.height_mm * 0.25);
  return next;
}

function sculptProfile(p) {
  return monotoneProfile([0, p.belly_pos, p.neck_pos, 1],
    [p.base_d_mm / 2, p.belly_d_mm / 2, p.neck_d_mm / 2, p.mouth_d_mm / 2],
    p.shoulder, p.height_mm);
}
/* The plan is an ellipse: every control diameter is the wide way across, so
   the squash only ever takes depth away. */
function sculptAspect(p) { return Math.max(0.35, 1 - p.oval); }
function sculptPlan(p, angle) {
  const c = Math.cos(angle), s = Math.sin(angle) / sculptAspect(p);
  return 1 / Math.sqrt(c * c + s * s);
}
function sculptFinsOn(p) {
  return p.fin_count >= 3 && p.fin_mm > 0.15 && p.fin_end > p.fin_start + 0.02;
}
function sculptBand(p, t) {
  if (!sculptFinsOn(p) || t <= p.fin_start || t >= p.fin_end) return 0;
  const u = (t - p.fin_start) / Math.max(p.fin_end - p.fin_start, 1e-6);
  const fade = Math.max(p.fin_fade, 1e-6);
  const x = Math.min(1, Math.max(0, Math.min(u / fade, (1 - u) / fade, 1)));
  return x * x * (3 - 2 * x);
}
function sculptSweep(p, t) {
  const ease = t * (1 - p.sweep_ease) + p.sweep_ease * (3 * t * t - 2 * t ** 3);
  return p.sweep_deg * Math.PI / 180 * ease;
}
/* One rib: a cosine bump filling fin_width of its own pitch, raised to a power
   that runs it from a soft swell to a steep-sided rib. */
function sculptFin(p, angle, t) {
  const band = sculptBand(p, t);
  if (band <= 0) return 0;
  const pitch = TAU / Math.max(p.fin_count, 1);
  const half = p.fin_width * pitch / 2;
  const offset = ((angle + pitch / 2) % pitch + pitch) % pitch - pitch / 2;
  const u = Math.abs(offset) / half;
  if (u >= 1) return 0;
  let depth = p.fin_mm;
  if (p.fin_vary > 0) {
    const index = Math.round(angle / pitch) % Math.max(p.fin_count, 1);
    depth *= 1 - p.fin_vary * 0.4 * hash01(index, 1, p.seed);
  }
  const g = 0.4 + 1.1 * (1 - p.fin_sharp);
  return depth * band * (0.5 + 0.5 * Math.cos(Math.PI * u)) ** g;
}
function sculptRadius(p, prof, angle, t) {
  return prof.radiusAt(t) * sculptPlan(p, angle) + sculptFin(p, angle + sculptSweep(p, t), t);
}

/* Where the mouth is cut. Both cutters are analytic, and both are lifted
   0.6 mm clear of the rim where they would otherwise be tangent to it -- the
   same clearance the template uses, for the same reason. */
function sculptRim(p, prof) {
  const H = p.height_mm;
  if (p.rim_cut === "flat" || p.rim_drop_mm <= 0.1) return () => H;
  let ref = 0;
  for (let i = 0; i < 360; i++) {
    const a = TAU * i / 360;
    ref = Math.max(ref, sculptRadius(p, prof, a, 1) * Math.cos(a));
  }
  const clear = 0.6;
  if (p.rim_cut === "slant") {
    const slope = p.rim_drop_mm / (2 * ref);
    return x => Math.min(H, H + clear - p.rim_drop_mm / 2 + slope * x);
  }
  const drop = Math.min(p.rim_drop_mm, ref * 0.95);
  const radius = (ref * ref + drop * drop) / (2 * drop);
  const centre = H + clear - drop + radius;
  return x => Math.abs(x) >= radius ? H
    : Math.min(H, centre - Math.sqrt(radius * radius - x * x));
}
/* The height where one column of the wall meets the cut. The cut is a function
   of x and x depends on the height, so it is solved rather than evaluated. */
function sculptTop(p, prof, zrim, angle) {
  const H = p.height_mm;
  const at = t => H * t - zrim(sculptRadius(p, prof, angle, t) * Math.cos(angle));
  if (at(1) <= 0) return 1;
  let lo = 0.2, hi = 1;
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    if (at(mid) > 0) hi = mid; else lo = mid;
  }
  return (lo + hi) / 2;
}

/* One closed shell -- outer skin, rim, cavity, floor. The cavity follows the
   body and not the ribs, which is what makes them solid ribs rather than
   corrugations, and what the material readout measures. */
function sculptMesh(p, quality) {
  const prof = sculptProfile(p);
  const zrim = sculptRim(p, prof);
  const aspect = sculptAspect(p);
  const H = p.height_mm;
  const build = new Builder();
  const fins = sculptFinsOn(p);
  let cols = fins ? Math.min(288, Math.max(96, p.fin_count * 14)) : 96;
  let rows = quality === "export" ? 52 : 34;
  if (quality !== "export") cols = Math.min(cols, 216);

  const outer = [], inner = [];
  for (let j = 0; j < cols; j++) {
    const angle = TAU * j / cols;
    const top = sculptTop(p, prof, zrim, angle);
    const oc = [], ic = [];
    for (let i = 0; i <= rows; i++) {
      const t = top * i / rows;
      const r = sculptRadius(p, prof, angle, t);
      oc.push([r * Math.cos(angle), r * Math.sin(angle) * aspect, H * t]);
      const zi = p.base_mm + (H * top - p.base_mm) * i / rows;
      const ti = Math.min(1, zi / H);
      const slope = prof.slopeAt(ti);
      const wall = p.wall_mm * Math.min(2.2, Math.sqrt(1 + slope * slope));
      const ri = Math.max(0.5, prof.radiusAt(ti) * sculptPlan(p, angle) - wall);
      ic.push([ri * Math.cos(angle), ri * Math.sin(angle) * aspect, zi]);
    }
    outer.push(oc); inner.push(ic);
  }
  for (let j = 0; j < cols; j++) {
    const k = (j + 1) % cols;
    for (let i = 0; i < rows; i++) {
      build.quad(outer[j][i], outer[k][i], outer[k][i + 1], outer[j][i + 1]);
      build.quad(inner[k][i], inner[j][i], inner[j][i + 1], inner[k][i + 1]);
    }
    build.quad(outer[j][rows], outer[k][rows], inner[k][rows], inner[j][rows]);
    build.tri([0, 0, 0], outer[k][0], outer[j][0]);
    build.tri([0, 0, p.base_mm], inner[j][0], inner[k][0]);
  }
  const positions = new Float32Array(build.pos);
  positions.materialVolume = Math.abs(build.volume());
  return positions;
}

/* The template's preconditions, checked as you drag. */
function sculptCheck(p) {
  const out = [];
  const room = 1 - p.oval;
  const H = p.height_mm;
  const arc = p.fin_width * Math.PI * p.belly_d_mm / Math.max(p.fin_count, 1);
  const steep = 2 * p.fin_mm / Math.max(arc, 1e-6);
  if (!(p.neck_pos > p.belly_pos + 0.05))
    out.push(["The neck sits at or below the belly.", "raise the neck, or drop the belly"]);
  if (!(p.fin_end > p.fin_start + 0.1))
    out.push(["The fins stop before they start.", "widen the band"]);
  if (!(p.base_mm < H * 0.25))
    out.push(["The floor is a quarter of the whole vase.", "thin the floor"]);
  if (!(Math.min(p.base_d_mm, p.belly_d_mm, p.neck_d_mm, p.mouth_d_mm) * room > p.wall_mm * 2 + 6))
    out.push(["The cavity does not fit inside the narrowest diameter.",
              "widen that diameter, thin the wall, or squash it less"]);
  const spans = [
    [p.belly_d_mm - p.base_d_mm, p.belly_pos, "belly"],
    [p.neck_d_mm - p.belly_d_mm, p.neck_pos - p.belly_pos, "neck"],
    [p.mouth_d_mm - p.neck_d_mm, 1 - p.neck_pos, "mouth"]
  ];
  for (const [delta, span, where] of spans) {
    if (Math.abs(delta) / 2 > span * H) {
      out.push([`The ${where} turns faster than 45°, which needs support.`,
                delta > 0 ? "flare it less, or raise it further up" : "close it in more gently"]);
      break;
    }
  }
  if (p.rim_cut !== "flat" && !(p.rim_drop_mm <= (1 - p.neck_pos) * H * 0.9))
    out.push(["The cut runs below the neck: that is a section, not a mouth.",
              "a shallower drop, or a lower neck"]);
  if (p.rim_cut === "saddle" && !(p.rim_drop_mm <= p.mouth_d_mm * 0.45))
    out.push(["No cylinder dips that far across a mouth that narrow.",
              "a shallower scoop, or a wider mouth"]);
  if (p.fin_count >= 3) {
    if (!(p.fin_mm <= p.fin_fade * (p.fin_end - p.fin_start) * H))
      out.push(["The ribs arrive at full depth faster than 45°, which is a ledge.",
                "a longer fade, a wider band, or shallower ribs"]);
    if (!(arc * room >= 2.0))
      out.push(["The ribs come out narrower than two beads.",
                "wider or fewer ribs, or less squash"]);
    if (!(p.fin_count * steep * (1 + 2 * p.oval) <= 50))
      out.push(["That surface costs more to mesh than the pipeline allows.",
                "shallower or wider ribs, fewer of them, or less squash"]);
    if (!(p.fin_count * p.fin_count * Math.abs(p.sweep_deg) * (1 + 2 * p.oval)
          * Math.max(0.5, steep) <= 15000))
      out.push(["Swept ribs cross the mesher's grid diagonally, and this many cost too much.",
                "less sweep, fewer ribs, or shallower ones"]);
  }
  if (!(p.wall_mm * room >= 0.9))
    out.push(["The squash leaves the wall too thin to print.", "a thicker wall, or less squash"]);
  if (!(p.base_d_mm * p.base_d_mm * room >= 470))
    out.push(["The footprint is too small to hold the plate.", "a wider base, or less squash"]);
  return out;
}

/* Chip icon: the outer envelope, ribs included, so the icon is the vase. */
function sculptSilhouette(preset) {
  const p = Object.assign({}, SCULPT_DEFAULTS, preset, {seed: 3});
  const prof = sculptProfile(p);
  const zrim = sculptRim(p, prof);
  const right = [];
  for (let i = 0; i <= 44; i++) {
    const t = i / 44;
    if (p.height_mm * t > zrim(prof.radiusAt(t)) + 0.01) break;
    right.push([prof.radiusAt(t) + (sculptFinsOn(p) ? p.fin_mm * sculptBand(p, t) * 0.8 : 0),
                p.height_mm * t]);
  }
  if (right.length < 2) right.push([prof.radiusAt(0), p.height_mm]);
  const maxR = Math.max(...right.map(q => q[0])) || 1;
  const k = Math.min(12 / maxR, 27 / p.height_mm);
  const put = ([r, z]) => `${(16 + r * k).toFixed(1)},${(30 - z * k).toFixed(1)}`;
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="M` +
    right.map(put).join("L") + "L" +
    right.slice().reverse().map(([r, z]) =>
      `${(16 - r * k).toFixed(1)},${(30 - z * k).toFixed(1)}`).join("L") +
    `Z"/></svg>`;
}

/* Shuffle: the proportion and feasibility nodes, as the generator runs them. */
function sculptShuffle(next, base, seed) {
  const height = next.height_mm;
  const reference = base.height_mm;
  ["base_d_mm", "belly_d_mm", "neck_d_mm", "mouth_d_mm"].forEach(name => {
    const wobble = 1 + 0.07 * (hash01(name.length, name.charCodeAt(1), seed) * 2 - 1);
    next[name] = height * (base[name] / reference) * wobble;
  });
  if (base.fin_count >= 3) {
    const pitch = base.belly_d_mm / base.fin_count;
    next.fin_count = Math.max(4, Math.round(next.belly_d_mm / pitch));
  }
  next.oval = Math.min(Math.max(next.oval, 0), 0.55);
  const room = 1 - next.oval;
  next.wall_mm = Math.max(next.wall_mm, 0.95 / room);
  next.belly_pos = Math.min(Math.max(next.belly_pos, 0.16), 0.72);
  next.neck_pos = Math.min(Math.max(next.neck_pos, next.belly_pos + 0.08), 0.95);

  const floor = (next.wall_mm * 2 + 7) / room;
  ["base_d_mm", "belly_d_mm", "neck_d_mm", "mouth_d_mm"].forEach(n => {
    next[n] = Math.max(next[n], floor);
  });
  next.base_d_mm = Math.max(next.base_d_mm, Math.sqrt(480 / room));
  [["base_d_mm", "belly_d_mm", next.belly_pos],
   ["belly_d_mm", "neck_d_mm", next.neck_pos - next.belly_pos],
   ["neck_d_mm", "mouth_d_mm", 1 - next.neck_pos]].forEach(([lower, upper, span]) => {
    const allowed = span * next.height_mm * 1.92;
    const delta = next[upper] - next[lower];
    if (Math.abs(delta) > allowed) next[upper] = next[lower] + (delta > 0 ? allowed : -allowed);
    next[upper] = Math.max(next[upper], floor);
  });

  next.fin_start = Math.min(Math.max(next.fin_start, 0), 0.78);
  next.fin_end = Math.min(Math.max(next.fin_end, next.fin_start + 0.12), 1);
  if (next.fin_count >= 3) {
    next.fin_count = Math.min(next.fin_count, 14);
    next.fin_width = Math.min(Math.max(next.fin_width, 0.25), 0.9);
    while (next.fin_count > 4 &&
           next.fin_width * Math.PI * next.belly_d_mm / next.fin_count * room < 2.2) {
      next.fin_count -= 1;
    }
    next.fin_mm = Math.min(next.fin_mm,
      next.fin_fade * (next.fin_end - next.fin_start) * next.height_mm);
    const arc = () => next.fin_width * Math.PI * next.belly_d_mm / Math.max(next.fin_count, 1);
    const squash = 1 + 2 * next.oval;
    const budget = 46 / (next.fin_count * squash);
    if (2 * next.fin_mm / arc() > budget) next.fin_mm = Math.max(0, budget * arc() / 2);
    const load = next.fin_count * next.fin_count * squash
      * Math.max(0.5, 2 * next.fin_mm / arc());
    if (Math.abs(next.sweep_deg) * load > 14000)
      next.sweep_deg = (next.sweep_deg >= 0 ? 1 : -1) * (14000 / load);
  } else {
    next.fin_count = 0;
  }
  if (next.rim_cut !== "flat") {
    next.rim_drop_mm = Math.min(next.rim_drop_mm,
      (1 - next.neck_pos) * next.height_mm * 0.85);
    if (next.rim_cut === "saddle")
      next.rim_drop_mm = Math.min(next.rim_drop_mm, next.mouth_d_mm * 0.42);
  }
  next.base_mm = Math.min(next.base_mm, next.height_mm * 0.22);
  return next;
}
