/* --- the profile, the plan, the ribs ------------------------------- */
/* Three control points -- base, belly, rim -- with the belly always the
   widest, which is what lets width_mm mean the size of the thing. */
function holderProfile(p) {
  const half = p.width_mm / 2;
  const belly = Math.min(0.9, Math.max(0.1, p.belly_pos));
  return monotoneProfile([0, belly, 1],
    [p.base_frac * half, half, p.top_frac * half], p.shoulder, p.height_mm);
}
function holderPlanRaw(p, a) {
  if (p.plan === "heart") {
    const s = Math.sin(a), c = Math.cos(a);
    return 2 - 2 * s + s * Math.sqrt(Math.abs(c)) / (s + 1.4);
  }
  const n = Math.max(3, Math.round(p.plan_points));
  if (p.plan === "polygon") {
    const step = TAU / n, half = step / 2;
    return Math.cos(half) / Math.cos((((a + half) % step) + step) % step - half);
  }
  if (p.plan === "star" || p.plan === "petal") {
    const k = 0.5 + 0.5 * Math.cos(n * a);
    return Math.pow(k, p.plan === "star" ? 2.2 : 0.55);
  }
  return 1;
}
/* Normalised twice, exactly as the template does it: once so the outline's own
   peak is 1, and again after the squash so width_mm is the largest dimension of
   the finished plan rather than of the circle it started from. */
function holderPlanner(p) {
  const aspect = Math.max(0.5, 1 - p.oval);
  const ellipse = a => {
    const c = Math.cos(a), s = Math.sin(a) / aspect;
    return 1 / Math.sqrt(c * c + s * s);
  };
  let peak = 0;
  for (let i = 0; i < 720; i++) peak = Math.max(peak, holderPlanRaw(p, TAU * i / 720));
  if (!(peak > 1e-6)) peak = 1;
  const mix = a => 1 - p.plan_depth + p.plan_depth * holderPlanRaw(p, a) / peak;
  let norm = 0;
  for (let i = 0; i < 720; i++) {
    const a = TAU * i / 720;
    norm = Math.max(norm, mix(a) * ellipse(a));
  }
  if (!(norm > 1e-6)) norm = 1;
  const plan = a => mix(a) * ellipse(a) / norm;
  let low = Infinity;
  for (let i = 0; i < 720; i++) low = Math.min(low, plan(TAU * i / 720));
  return {plan: plan, low: low};
}
function holderRibsOn(p) { return p.rib_count >= 3 && p.rib_mm > 0.15; }
/* One rib: a cosine bump across its own pitch, times how much rib there is at
   this height. One row fades in and out; more than one is a stack of bumps. */
function holderRib(p, a, t) {
  if (!holderRibsOn(p)) return 0;
  const pitch = TAU / Math.max(p.rib_count, 1);
  const half = Math.max(p.rib_width * pitch / 2, 1e-9);
  const offset = (((a + pitch / 2) % pitch) + pitch) % pitch - pitch / 2;
  const u = Math.abs(offset) / half;
  if (u >= 1) return 0;
  const g = 0.4 + 1.1 * (1 - p.rib_sharp);
  const column = Math.pow(0.5 + 0.5 * Math.cos(Math.PI * u), g);
  const rows = Math.max(1, Math.round(p.rib_rows));
  let band;
  if (rows <= 1) {
    const fade = 0.12;
    const x = Math.min(1, Math.max(0, Math.min(t / fade, (1 - t) / fade, 1)));
    band = x * x * (3 - 2 * x);
  } else {
    band = 0.5 - 0.5 * Math.cos(TAU * ((((t * rows) % 1) + 1) % 1));
  }
  let depth = p.rib_mm;
  if (p.rib_vary > 0) {
    const n = Math.max(Math.round(p.rib_count), 1);
    const index = ((Math.round(a / pitch) % n) + n) % n;
    depth *= 1 - p.rib_vary * 0.4 * hash01(index, 1, p.seed);
  }
  return depth * column * band;
}
/* The bore, clamped against the narrowest the body gets over the band it
   passes through -- the same clamp the template applies, so the preview never
   shows a socket the kernel would refuse to cut. */
function holderSocket(p, prof, low) {
  const depth = Math.max(2, Math.min(p.socket_depth_mm, p.height_mm - p.floor_mm));
  const lo = Math.max(0, (p.height_mm - depth) / Math.max(p.height_mm, 1e-6));
  let bore = Infinity;
  for (let i = 0; i <= 16; i++) bore = Math.min(bore, prof.radiusAt(lo + (1 - lo) * i / 16));
  const radius = Math.max(3, Math.min(p.socket_d_mm / 2, bore * low - p.wall_mm));
  return {r: radius, depth: depth, floorZ: p.height_mm - depth};
}
/* Where the windows are. A window is a wedge, so its opening is a fixed
   fraction of the pitch at every radius; near the top and bottom of the band
   the 45 degree nose closes it in by a fixed number of millimetres instead. */
function holderWindows(p, socketR) {
  const lo = Math.max(p.height_mm * p.pierce_lo, p.floor_mm + 1);
  const hi = Math.min(p.height_mm * p.pierce_hi, p.height_mm - 1.5);
  if (!(p.pierce_count >= 1 && hi > lo + 2)) return null;
  const count = Math.round(p.pierce_count);
  const pitch = TAU / count;
  const halfAngle = p.pierce_w * pitch / 2;
  const nose = Math.min(halfAngle * Math.max(socketR - 2, 1) * 0.9, (hi - lo) * 0.49);
  return {
    lo: lo, hi: hi,
    open: (a, z, r) => {
      if (z <= lo || z >= hi) return false;
      const offset = ((a % pitch) + pitch) % pitch;
      const away = Math.min(offset, pitch - offset) * r;
      const shoulder = Math.max(0, nose - Math.min(z - lo, hi - z));
      return away < halfAngle * r - shoulder;
    }
  };
}

/* --- the standing back --------------------------------------------- */
/* Each shape is one or two boundary paths in the plate's own plane. A pair is
   stripped between (a crescent, an arch frame); a single path is a convex
   outline and is fanned from its centre. */
function holderBackPaths(p) {
  const half = p.width_mm / 2;
  if (p.back === "crescent") {
    const R = p.back_h_mm / 2, rb = R * 0.72, dx = R * 0.30, dz = R * 0.10;
    const d = Math.hypot(dx, dz);
    const a = (d * d + R * R - rb * rb) / (2 * d);
    const h2 = R * R - a * a;
    if (!(h2 > 0)) return null;
    const ux = dx / d, uz = dz / d, hh = Math.sqrt(h2);
    const p1 = [a * ux - hh * uz, a * uz + hh * ux];
    const p2 = [a * ux + hh * uz, a * uz - hh * ux];
    const t1 = Math.atan2(p1[1], p1[0]), t2 = Math.atan2(p2[1], p2[0]);
    /* The outer arc is the long way round, away from the bite. */
    let sweep = t2 - t1;
    while (sweep <= 0) sweep += TAU;
    if (sweep < Math.PI) { sweep = sweep - TAU; }
    const s1 = Math.atan2(p1[1] - dz, p1[0] - dx), s2 = Math.atan2(p2[1] - dz, p2[0] - dx);
    let bite = s2 - s1;
    while (bite <= -Math.PI) bite += TAU;
    while (bite > Math.PI) bite -= TAU;
    const N = 40, outer = [], inner = [];
    for (let i = 0; i <= N; i++) {
      const f = i / N;
      outer.push([R * Math.cos(t1 + sweep * f), R * Math.sin(t1 + sweep * f) + R]);
      inner.push([dx + rb * Math.cos(s1 + bite * f), dz + rb * Math.sin(s1 + bite * f) + R]);
    }
    return {outer: outer, inner: inner};
  }
  if (p.back === "arch") {
    const w = Math.min(p.back_h_mm * 0.62, half * 1.5), r = w / 2;
    const stem = Math.max(1, p.back_h_mm - r);
    const hw = Math.max(0, w - p.back_t_mm * 2.2) / 2;
    const hbase = p.back_t_mm * 1.2, hstem = Math.max(1, stem - hbase);
    const N = 24, outer = [], inner = [];
    const path = (into, x0, z0, zTop, rad) => {
      into.push([-x0, z0]);
      into.push([-x0, zTop]);
      for (let i = 0; i <= N; i++) {
        const th = Math.PI - Math.PI * i / N;
        into.push([rad * Math.cos(th), zTop + rad * Math.sin(th)]);
      }
      into.push([x0, zTop]);
      into.push([x0, z0]);
    };
    path(outer, w / 2, 0, stem, r);
    if (hw < 1.5) return {outer: outer, inner: null, convex: false};
    path(inner, hw, hbase, hbase + hstem, hw);
    return {outer: outer, inner: inner};
  }
  const w = Math.min(p.back_h_mm * 0.72, half * 1.6);
  const rad = Math.min(w, p.back_h_mm) * 0.18;
  const N = 8, outer = [];
  const corner = (cx, cz, from) => {
    for (let i = 0; i <= N; i++) {
      const th = from + Math.PI / 2 * i / N;
      outer.push([cx + rad * Math.cos(th), cz + rad * Math.sin(th)]);
    }
  };
  corner(w / 2 - rad, rad, -Math.PI / 2);
  corner(w / 2 - rad, p.back_h_mm - rad, 0);
  corner(-w / 2 + rad, p.back_h_mm - rad, Math.PI / 2);
  corner(-w / 2 + rad, rad, Math.PI);
  return {outer: outer, inner: null, closed: true};
}
/* Extrude a plate's outline to thickness, at y = back, and add it to a
   builder. Everything the plate needs is a pair of paths or one closed one. */
function holderBackSolid(build, p, paths, backY) {
  const t = p.back_t_mm / 2;
  const front = q => [q[0], backY + t, q[1]];
  const back = q => [q[0], backY - t, q[1]];
  const plate = new Builder();
  /* A pair of paths is a ring: the two faces are the strip between them, and
     the loop that walks out along one and back along the other is the single
     boundary the side wall follows -- so the ends of the ring close
     themselves rather than needing caps of their own. */
  let loop;
  if (paths.inner) {
    const n = paths.outer.length;
    for (let i = 0; i < n - 1; i++) {
      const a = paths.outer[i], b = paths.outer[i + 1];
      const c = paths.inner[i], d = paths.inner[i + 1];
      plate.quad(front(a), front(b), front(d), front(c));
      plate.quad(back(c), back(d), back(b), back(a));
    }
    loop = paths.outer.concat(paths.inner.slice().reverse());
  } else {
    loop = paths.outer;
    const n = loop.length;
    let cx = 0, cz = 0;
    for (const q of loop) { cx += q[0] / n; cz += q[1] / n; }
    const mid = [cx, cz];
    for (let i = 0; i < n; i++) {
      const a = loop[i], b = loop[(i + 1) % n];
      plate.tri(front(mid), front(a), front(b));
      plate.tri(back(b), back(a), back(mid));
    }
  }
  for (let i = 0; i < loop.length; i++) {
    const a = loop[i], b = loop[(i + 1) % loop.length];
    if (a[0] === b[0] && a[1] === b[1]) continue;
    plate.quad(front(b), front(a), back(a), back(b));
  }
  build.merge(plate);
}

/* --- the mesh ------------------------------------------------------- */
/* One closed shell: the outer skin with the windows carved out of it, the
   cylinder they open into, the bore and its floor, the base, and -- when there
   is one -- the standing back fused on. */
function holderMesh(p, quality) {
  const prof = holderProfile(p);
  const planner = holderPlanner(p);
  const sock = holderSocket(p, prof, planner.low);
  const win = holderWindows(p, sock.r);
  const H = p.height_mm;
  const build = new Builder();
  let cols = 96;
  if (holderRibsOn(p)) cols = Math.max(cols, Math.round(p.rib_count) * 8);
  if (p.plan === "heart" && p.plan_depth > 0.02) cols = Math.max(cols, 192);
  else if (p.plan !== "round" && p.plan_depth > 0.02) {
    cols = Math.max(cols, Math.round(p.plan_points) * 16);
  }
  cols = Math.min(cols, quality === "export" ? 320 : 208);
  if (win) cols = Math.round(cols / Math.round(p.pierce_count)) * Math.round(p.pierce_count);
  const rows = quality === "export" ? 44 : 30;

  const outer = [], bore = [], angles = [];
  for (let j = 0; j < cols; j++) {
    const a = TAU * j / cols;
    angles.push(a);
    const skin = [], core = [];
    for (let i = 0; i <= rows; i++) {
      const t = i / rows, z = H * t;
      const r = Math.max(0.4, prof.radiusAt(t) * planner.plan(a) + holderRib(p, a, t));
      skin.push([r * Math.cos(a), r * Math.sin(a), z]);
      core.push([sock.r * Math.cos(a), sock.r * Math.sin(a), z]);
    }
    outer.push(skin); bore.push(core);
  }
  /* A cell is cut away where a window covers it; the cylinder it opens into is
     the bore, carried down past the bore's own floor where it has to be. */
  /* The bore's floor is snapped to a row, so the ring that closes it and the
     bottom of the bore wall are the same circle rather than a millimetre
     apart. One row is about a millimetre of depth: invisible here, and the
     kernel is the one that cuts the socket to the depth actually asked for. */
  const iFloor = Math.max(0, Math.min(rows - 1, Math.round(sock.floorZ / H * rows)));
  const floorZ = H * iFloor / rows;
  /* A window opens where it breaks into the bore. Lower down the kernel cuts a
     blind slot into the solid core, which the preview leaves alone: drawing it
     would put three sheets of surface on one edge, and a shell that is not
     closed is one the material readout cannot measure. */
  const cut = (j, i) => {
    if (!win || i <= iFloor) return false;
    const t = (i + 0.5) / rows;
    const a = angles[j] + Math.PI / cols;
    const r = prof.radiusAt(t) * planner.plan(a);
    return win.open(a, H * t, r);
  };
  for (let j = 0; j < cols; j++) {
    const k = (j + 1) % cols;
    for (let i = 0; i < rows; i++) {
      /* A window takes the wall away entirely over its own span, so a cut cell
         gets no surface at all: what bounds the opening is the reveal round
         its edge, from the outer skin back to the bore. */
      if (!cut(j, i)) {
        build.quad(outer[j][i], outer[k][i], outer[k][i + 1], outer[j][i + 1]);
      }
      if (cut(j, i) !== cut(((j - 1) % cols + cols) % cols, i)) {
        const a1 = outer[j][i], a2 = outer[j][i + 1];
        const b1 = bore[j][i], b2 = bore[j][i + 1];
        if (cut(j, i)) build.quad(a2, a1, b1, b2); else build.quad(a1, a2, b2, b1);
      }
      if (i > 0 && cut(j, i) !== cut(j, i - 1)) {
        const a1 = outer[j][i], a2 = outer[k][i];
        const b1 = bore[j][i], b2 = bore[k][i];
        if (cut(j, i)) build.quad(a1, a2, b2, b1); else build.quad(a2, a1, b1, b2);
      }
    }
    /* The bore itself, from its floor to the rim, and the ring of the top face
       between the bore and the outer rim. */
    for (let i = iFloor; i < rows; i++) {
      if (!cut(j, i)) build.quad(bore[k][i], bore[j][i], bore[j][i + 1], bore[k][i + 1]);
    }
    const fz = [sock.r * Math.cos(angles[j]), sock.r * Math.sin(angles[j]), floorZ];
    const fzk = [sock.r * Math.cos(angles[k]), sock.r * Math.sin(angles[k]), floorZ];
    /* The floor of the socket faces up into it, so it winds the other way from
       the base, which faces down at the plate. */
    build.tri([0, 0, floorZ], fz, fzk);
    build.quad(outer[j][rows], outer[k][rows], bore[k][rows], bore[j][rows]);
    build.tri([0, 0, 0], outer[k][0], outer[j][0]);
  }
  if (p.back !== "none" && p.back_h_mm > H + 2) {
    const paths = holderBackPaths(p);
    if (paths) {
      const rear = prof.radiusAt(0) * planner.plan(TAU * 3 / 4);
      const backY = -Math.max(sock.r + p.back_t_mm / 2 + 1, rear - p.back_t_mm / 2 - 2);
      holderBackSolid(build, p, paths, backY);
    }
  }
  const positions = new Float32Array(build.pos);
  positions.materialVolume = Math.abs(build.volume());
  return positions;
}

/* The template's preconditions, checked as you drag. */
function holderCheck(p) {
  const out = [];
  const room = 1 - p.oval;
  const H = p.height_mm;
  const arc = p.rib_width * Math.PI * p.width_mm / Math.max(p.rib_count, 1);
  const rows = Math.max(p.rib_rows, 1);
  if (!(p.socket_depth_mm + p.floor_mm <= H))
    out.push(["The socket is deeper than the body is tall.",
              "a shallower socket, a thinner floor, or more height"]);
  if (!(p.socket_d_mm + p.wall_mm * 2 <= p.width_mm * room))
    out.push(["The candle does not fit inside the body.",
              "a wider holder, a smaller socket, or less squash"]);
  if (!(p.floor_mm <= H * 0.6))
    out.push(["The floor is most of the holder.", "a thinner floor"]);
  if (!(p.width_mm * (1 - p.base_frac) / 2 <= p.belly_pos * H))
    out.push(["The body flares off the plate faster than 45°, which needs support.",
              "a wider base, or a belly further up"]);
  if (!(p.width_mm * (1 - p.top_frac) / 2 <= (1 - p.belly_pos) * H))
    out.push(["The body closes in over the socket faster than 45°.",
              "a wider rim, or a belly further down"]);
  if (p.rib_count >= 3) {
    if (!(arc * room >= 2.0))
      out.push(["The ribs come out narrower than two beads.",
                "wider or fewer ribs, or less squash"]);
    if (!(p.rib_mm <= H * 0.12 * rows))
      out.push(["The ribs arrive at full depth faster than 45°, which is a ledge.",
                "shallower ribs, more height, or more rows"]);
    if (!(p.rib_mm * 2 * rows <= H))
      out.push(["Each row of bumps rises faster than 45°.", "shallower ribs, or fewer rows"]);
    if (!(p.rib_count * (2 * p.rib_mm / Math.max(arc, 1e-6)) * (1 + 2 * p.oval)
          * (p.width_mm / 90) * (1 + p.plan_depth) <= 46))
      out.push(["That surface costs more to mesh than the pipeline allows.",
                "shallower or wider ribs, fewer of them, or a plainer plan"]);
  }
  if (p.pierce_count >= 1) {
    if (!(p.pierce_hi >= p.pierce_lo + 0.15))
      out.push(["The windows stop before they start.", "widen the band"]);
    if (!((1 - p.pierce_w) * Math.PI * p.width_mm / Math.max(p.pierce_count, 1) * room >= 2.5))
      out.push(["The pillars between the windows are thinner than a printed wall.",
                "narrower or fewer windows, or less squash"]);
    if (!((1 - p.pierce_w) * Math.PI * p.socket_d_mm / Math.max(p.pierce_count, 1) >= 2.0))
      out.push(["Those pillars are thinner still where they meet the bore.",
                "narrower or fewer windows, or a wider socket"]);
    if (!(p.pierce_lo * H >= p.floor_mm))
      out.push(["The windows cut into the floor.", "raise the window base"]);
    if (!(p.plan_depth <= 0.6))
      out.push(["A window cut across a corner that sharp leaves a sliver of wall.",
                "a rounder plan, or no windows"]);
  }
  if (p.back !== "none") {
    if (!(p.back_h_mm >= H + 12))
      out.push(["The back does not clear the body it stands on.",
                "a taller back, or a lower body"]);
    if (!(p.socket_d_mm / 2 + p.back_t_mm + 4 <= p.width_mm * p.base_frac * room / 2))
      out.push(["There is no room in front of the back for the candle.",
                "a wider holder, a thinner back, or a smaller socket"]);
    if (p.back === "crescent" && !(H >= p.back_h_mm * 0.15))
      out.push(["The moon opens outward faster than 45° where the body ends.",
                "a taller body, or a smaller moon"]);
  }
  if (!(p.wall_mm * room >= 1.2))
    out.push(["The squash leaves the wall too thin to print.", "a thicker wall, or less squash"]);
  if (!(p.width_mm * p.width_mm * room >= 900))
    out.push(["The footprint is too small to hold the plate.", "a wider holder, or less squash"]);
  return out;
}

/* Chip icon: the plan seen from above, which is the thing that tells the
   styles apart at 32 pixels -- with the socket drawn out of it. */
function holderSilhouette(preset) {
  const p = Object.assign({}, HOLDER_DEFAULTS, preset, {seed: 3});
  const planner = holderPlanner(p);
  const half = p.width_mm / 2;
  const ring = [];
  for (let i = 0; i <= 96; i++) {
    const a = TAU * i / 96;
    const r = half * planner.plan(a) + (holderRibsOn(p) ? p.rib_mm * 0.6 : 0);
    ring.push([r * Math.cos(a), r * Math.sin(a)]);
  }
  const maxR = Math.max(...ring.map(q => Math.hypot(q[0], q[1]))) || 1;
  const k = 13 / maxR;
  const put = ([x, y]) => `${(16 + x * k).toFixed(1)},${(16 - y * k).toFixed(1)}`;
  const bore = Math.max(2.5, Math.min(p.socket_d_mm / 2, half * planner.low - p.wall_mm) * k);
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">` +
    `<path fill-rule="evenodd" d="M` + ring.map(put).join("L") +
    `Z M${(16 + bore).toFixed(1)},16 a${bore.toFixed(1)},${bore.toFixed(1)} 0 1,0 ` +
    `${(-2 * bore).toFixed(1)},0 a${bore.toFixed(1)},${bore.toFixed(1)} 0 1,0 ` +
    `${(2 * bore).toFixed(1)},0Z"/></svg>`;
}

/* Shuffle: the proportion and feasibility nodes, as the generator runs them.
   The socket is deliberately not in the proportion list -- a tealight is
   39 mm across whatever size the holder is, and when it stops fitting it is
   the body that grows. */
function holderShuffle(next, base, seed) {
  const width = next.width_mm;
  const reference = base.width_mm;
  const wobble = 1 + 0.06 * (hash01(11, 3, seed) * 2 - 1);
  next.back_h_mm = width * (base.back_h_mm / reference) * wobble;
  if (base.rib_count >= 3) {
    const pitch = reference / base.rib_count;
    next.rib_count = Math.max(4, Math.round(width / pitch));
  }
  next.oval = Math.min(Math.max(next.oval, 0), 0.5);
  const room = 1 - next.oval;
  next.wall_mm = Math.min(Math.max(next.wall_mm, 1.25 / room), 8);
  next.width_mm = Math.max(next.width_mm, Math.sqrt(900 / room));
  next.plan_depth = Math.min(Math.max(next.plan_depth, 0), 0.9);
  next.belly_pos = Math.min(Math.max(next.belly_pos, 0.1), 0.9);
  next.base_frac = Math.min(Math.max(next.base_frac, 0.3), 1);
  next.top_frac = Math.min(Math.max(next.top_frac, 0.25), 1);

  let socket = Math.min(Math.max(next.socket_d_mm, 12), 90);
  for (let pass = 0; pass < 4; pass++) {
    const low = holderPlanLow(next);
    const deep = next.socket_depth_mm > next.height_mm * (1 - next.belly_pos);
    const bore = deep ? Math.min(next.base_frac, next.top_frac) : next.top_frac;
    const held = next.width_mm / 2 * bore * low * room;
    const need = socket / 2 + next.wall_mm + 0.6;
    if (held >= need) break;
    const wider = Math.min(220, next.width_mm * need / Math.max(held, 1e-6));
    if (wider > next.width_mm + 1e-6) { next.width_mm = wider; continue; }
    if (next.plan_depth > 0.02) { next.plan_depth = Math.max(0, next.plan_depth - 0.2); continue; }
    socket = Math.max(12, held * 2 - next.wall_mm * 2);
    break;
  }
  next.socket_d_mm = socket;
  holderSettle(next);

  if (next.rib_count >= 3 && next.rib_mm > 0.15) {
    next.rib_rows = Math.min(Math.max(Math.round(next.rib_rows), 1), 6);
    next.rib_width = Math.min(Math.max(next.rib_width, 0.2), 0.95);
    while (next.rib_count > 4 &&
           next.rib_width * Math.PI * next.width_mm / next.rib_count * room < 2.2) {
      next.rib_count -= 1;
    }
    const rows = Math.max(next.rib_rows, 1);
    next.rib_mm = Math.min(next.rib_mm, next.height_mm * 0.115 * rows,
                           next.height_mm / (2.1 * rows));
    const arc = next.rib_width * Math.PI * next.width_mm / Math.max(next.rib_count, 1);
    const load = next.rib_count * (1 + 2 * next.oval) * (next.width_mm / 90)
      * (1 + next.plan_depth);
    if (2 * next.rib_mm / Math.max(arc, 1e-6) * load > 46) {
      next.rib_mm = Math.max(0, 46 / Math.max(load, 1e-6) * arc / 2);
    }
  } else {
    next.rib_count = 0;
  }

  if (next.pierce_count >= 1) {
    next.plan_depth = Math.min(next.plan_depth, 0.6);
    next.pierce_lo = Math.min(
      Math.max(next.pierce_lo, next.floor_mm / Math.max(next.height_mm, 1e-6) + 0.02), 0.6);
    next.pierce_hi = Math.min(Math.max(next.pierce_hi, next.pierce_lo + 0.18), 0.95);
    next.pierce_w = Math.min(Math.max(next.pierce_w, 0.1), 0.8);
    while (next.pierce_count > 3 &&
           (1 - next.pierce_w) * Math.PI * next.width_mm / next.pierce_count * room < 2.8) {
      next.pierce_count -= 1;
    }
    while (next.pierce_count > 3 &&
           (1 - next.pierce_w) * Math.PI * next.socket_d_mm / next.pierce_count < 2.2) {
      next.pierce_count -= 1;
    }
  }

  if (next.back !== "none") {
    next.back_t_mm = Math.min(Math.max(next.back_t_mm, 4), 20);
    const need = next.socket_d_mm + next.back_t_mm * 2 + 8;
    let span = next.width_mm * next.base_frac * room;
    if (span < need) {
      next.width_mm = Math.min(220, next.width_mm * need / Math.max(span, 1e-6));
      span = next.width_mm * next.base_frac * room;
    }
    if (span < need) next.back_t_mm = Math.max(4, (span - next.socket_d_mm - 8) / 2);
  }
  next.height_mm = Math.min(Math.max(next.height_mm, 14), 120);
  next.width_mm = Math.min(Math.max(next.width_mm, 40), 220);
  holderSettle(next);
  return next;
}
/* The valley of the plan, whose radius the socket has to fit inside -- not the
   width, which is what the arms reach to. */
function holderPlanLow(p) {
  const depth = Math.min(Math.max(p.plan_depth, 0), 0.9);
  if (p.plan === "round" || depth <= 0) return 1;
  const low = p.plan === "polygon" ? Math.cos(Math.PI / Math.max(3, Math.round(p.plan_points))) : 0;
  return 1 - depth + depth * low;
}
/* The rules that read the body's overall size, applied last because the back
   is allowed to widen it and the socket is allowed to raise it. */
function holderSettle(next) {
  ["width_mm", "height_mm", "belly_pos", "floor_mm", "back_h_mm"].forEach(name => {
    next[name] = Math.round(next[name] * 100) / 100;
  });
  let H = next.height_mm;
  next.floor_mm = Math.min(Math.max(next.floor_mm, 1.5), H * 0.6, 10);
  next.socket_depth_mm = Math.floor(
    Math.min(Math.max(next.socket_depth_mm, 4), H - next.floor_mm - 0.1, 110) * 100) / 100;
  if (next.socket_depth_mm < 4) {
    next.height_mm = Math.min(120, next.floor_mm + 4.4);
    next.socket_depth_mm = 4;
    H = next.height_mm;
  }
  const low = 1.92 * next.belly_pos * H / Math.max(next.width_mm, 1e-6);
  const high = 1.92 * (1 - next.belly_pos) * H / Math.max(next.width_mm, 1e-6);
  next.base_frac = Math.min(1, Math.ceil(Math.max(next.base_frac, 1 - low) * 100) / 100);
  next.top_frac = Math.min(1, Math.ceil(Math.max(next.top_frac, 1 - high) * 100) / 100);
  if (next.back !== "none") {
    next.back_h_mm = Math.min(Math.ceil(Math.max(next.back_h_mm, H + 14) * 100) / 100, 160);
    if (next.back === "crescent") {
      next.back_h_mm = Math.floor(Math.min(next.back_h_mm, H / 0.16) * 100) / 100;
    }
  }
}

let dragging = false, lastX = 0, lastY = 0;

let lastPositions = null;
let refit = true;
function rebuild() {
  const positions = MODEL.mesh(P, "preview");
  lastPositions = positions;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geo.computeVertexNormals();
  geo.computeBoundingBox();
  if (shape) { scene.remove(shape); shape.geometry.dispose(); }
  shape = new THREE.Mesh(geo, material);
  scene.add(shape);

  const bb = geo.boundingBox;
  const size = new THREE.Vector3(); bb.getSize(size);
  const centre = new THREE.Vector3(); bb.getCenter(centre);
  orbit.target.set(centre.x, centre.y, centre.z);
  /* A slider drag keeps whatever zoom you set; a new model or a new preset
     is a different object, so that one gets framed. A 240 mm vase and a
     60 mm mushroom cannot share a camera distance. */
  if (refit) {
    refit = false;
    const reach = Math.hypot(size.x, size.y, size.z) / 2;
    const fov = camera.fov * Math.PI / 180;
    orbit.dist = Math.min(700, Math.max(60, reach / Math.tan(fov / 2) * 1.15));
  }
  applyCamera();
  draw();

  const tris = positions.length / 9;
  document.getElementById("readout").innerHTML =
    `<span>height <b>${size.z.toFixed(0)} mm</b></span>` +
    `<span>width <b>${Math.max(size.x, size.y).toFixed(0)} mm</b></span>` +
    `<span>material <b>~${(positions.materialVolume / 1000).toFixed(1)} cm³</b></span>` +
    `<span>triangles <b>${tris.toLocaleString()}</b></span>`;

  const problems = MODEL.check(P);
  const status = document.getElementById("status");
  const list = document.getElementById("status-list");
  status.dataset.state = problems.length ? "blocked" : "ok";
  document.getElementById("status-title").textContent =
    problems.length ? `${problems.length} thing${problems.length > 1 ? "s" : ""} to fix before it builds` : "Ready to build";
  document.getElementById("status-note").textContent = problems.length
    ? "The template refuses these combinations up front rather than building something that fails later."
    : "Every one of the template's preconditions holds. The command below builds this exact model in the CAD kernel and validates it.";
  list.hidden = problems.length === 0;
  list.innerHTML = problems.map(([what, fix]) => `<li>${what} <em>&mdash; ${fix}</em></li>`).join("");

  document.getElementById("command").textContent = command();
  document.getElementById("species-name").textContent = MODEL.labels[variant] || "";
}
function command() {
  const parts = SCHEMA.filter(f => f.k !== "seed").map(f => `--set ${f.k}=${P[f.k]}`);
  parts.push(`--set seed=${P.seed}`);
  return `formforge build ${MODEL.templateId} \\\n  ` + parts.join(" \\\n  ");
}

/* The panels are built from the model's own schema, so switching models

function buildControls() {

function addField(host, f) {
  {
  const field = document.createElement("div");

  if (f.choices) {

      `<output id="o-${f.k}">${fmt(f, P[f.k])}</output></div>` +

      `<input type="range" id="${id}" min="${f.min}" max="${f.max}" step="${f.step}" value="${P[f.k]}">`;
    const range = field.querySelector("input");

/* species chips, each drawn from its own preset's silhouette: the outer
   envelope of that species' cap and stem, so the icon is the model. */
function mushroomSilhouette(preset) {
  const p = Object.assign({}, MUSHROOM_DEFAULTS, preset, {seed: 3});
  const prof = capProfile(p);
  const capZ = p.stem_h_mm - p.cap_h_mm + p.cap_flesh_mm * 0.7;
  const stemR = p.stem_d_mm / 2;
  const top = prof.top.map(([r, z]) => [r, z + capZ]);
  const capLow = Math.min(...prof.inner.map(q => q[1])) + capZ;
  const totalH = Math.max(...top.map(q => q[1]));

  const radiusAt = z => {
    let r = 0;
    if (z <= p.stem_h_mm) {
      const t = Math.max(0, Math.min(1, z / p.stem_h_mm));
      r = stemR * (1 - p.stem_taper * t)
        * (1 + p.stem_bulb * Math.exp(-Math.pow(t / 0.18, 2)))
        * (1 + p.stem_flare * Math.pow(t, 6));
    }
    if (z >= capLow) {
      for (const [rr, zz] of top) if (zz >= z && rr > r) r = rr;
    }
    return r;
  };
  const right = [];
  for (let i = 0; i <= 40; i++) {
    const z = totalH * i / 40;
    right.push([radiusAt(z), z]);
  }
  const maxR = Math.max(...right.map(q => q[0])) || 1;
  const k = Math.min(13 / maxR, 26 / totalH);
  const put = ([r, z]) => `${(16 + r * k).toFixed(1)},${(29 - z * k).toFixed(1)}`;
  const path = "M" + right.map(put).join("L") +
    "L" + right.slice().reverse().map(([r, z]) =>
      `${(16 - r * k).toFixed(1)},${(29 - z * k).toFixed(1)}`).join("L") + "Z";
  return `<svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><path d="${path}"/></svg>`;
}

    chip.setAttribute("aria-pressed", String(name === variant));
    chip.innerHTML = MODEL.silhouette(MODEL.presets[name]) +

/* seed + shuffle: the jitter the generator applies, on the preset you are
   looking at, with the same proportion and feasibility rules after it */
document.getElementById("seed").addEventListener("input", e => {
  P.seed = Math.max(0, Math.min(9999, parseInt(e.target.value || "0", 10)));
  schedule();
});
function jitter(base, seed) {
  const next = Object.assign({}, base, {seed});
  Object.keys(MODEL.jitter).forEach(k => {
    const [mode, amount] = MODEL.jitter[k];
    if (typeof base[k] !== "number") return;
    const swing = hash01(k.length * 7, k.charCodeAt(0), seed) * 2 - 1;
    next[k] = mode === "rel" ? base[k] * (1 + amount * swing) : base[k] + amount * swing;
  });
  return next;
}
function clampToSchema(values) {
  SCHEMA.forEach(f => {
    if (f.choices) {
      values[f.k] = f.choices.includes(values[f.k]) ? values[f.k] : f.v;
      return;
    }
    let value = Math.min(f.max, Math.max(f.min, values[f.k]));
    value = f.step >= 1 ? Math.round(value) : Math.round(value / f.step) * f.step;
    values[f.k] = parseFloat(value.toFixed(2));
  });
  return values;
}

  const seed = Math.floor(Math.random() * 10000);
  const base = Object.assign({}, MODEL.defaults, MODEL.presets[variant]);
  P = clampToSchema(MODEL.shuffle(jitter(base, seed), base, seed));
  P.seed = seed;
  refit = true;
  syncInputs();
  rebuild();
});

  for (let i = 0; i < 80; i++) view.setUint8(i, i < head.length ? head.charCodeAt(i) : 32);

function stlAscii(pos) {
  const rows = ["solid " + MODEL.noun];
  for (let i = 0; i < pos.length; i += 9) {
    const n = faceNormal(pos, i);
    rows.push(` facet normal ${n[0].toFixed(4)} ${n[1].toFixed(4)} ${n[2].toFixed(4)}`, "  outer loop");
    for (let v = 0; v < 3; v++) {
      rows.push(`   vertex ${pos[i+v*3].toFixed(3)} ${pos[i+v*3+1].toFixed(3)} ${pos[i+v*3+2].toFixed(3)}`);
    }
    rows.push("  endloop", " endfacet");
  }
  rows.push("endsolid " + MODEL.noun);
  return rows.join("\n");
}
function faceNormal(pos, i) {
  const ux = pos[i+3]-pos[i], uy = pos[i+4]-pos[i+1], uz = pos[i+5]-pos[i+2];
  const vx = pos[i+6]-pos[i], vy = pos[i+7]-pos[i+1], vz = pos[i+8]-pos[i+2];
  const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
  const len = Math.hypot(nx, ny, nz) || 1;
  return [nx/len, ny/len, nz/len];
}
function stamp() {
  return `${variant}-${Math.round(P[MODEL.sizeKey])}mm-seed${P.seed}`;
}
function localSave(filename, data) {
  const blob = data instanceof ArrayBuffer ? new Blob([data], {type: "application/octet-stream"})
                                           : new Blob([data], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
document.getElementById("export-stl").addEventListener("click", async () => {
  const pos = MODEL.mesh(P, "export");
  if (downloads) {
    try {
      await downloads.save({filename: `${stamp()}-stl.txt`, data: stlAscii(pos)});
      toast("Saved. Rename it from .txt to .stl and it opens in any slicer.");
    } catch (err) {
      const code = (err && err.code) || "unavailable";
      toast(code === "declined" ? "Save cancelled."
        : code === "too_large" ? "That mesh is too big to hand over here — lower the wart count or the gill count."
        : "Saving is not available in this view. Use the command above instead.");
    }
    return;
  }
  localSave(`${stamp()}.stl`, stlBinary(pos));
  toast(`${stamp()}.stl saved — ${(pos.length / 9).toLocaleString()} triangles, millimetres.`);
});
document.getElementById("export-step").addEventListener("click", async () => {
  const script = boundScript(P);
  if (downloads) {
    try {
      await downloads.save({filename: `${stamp()}-${MODEL.noun}-py.txt`, data: script});
      toast(`Saved. Rename it to .py, then: pip install build123d && python ${MODEL.noun}.py`);
    } catch (err) {
      toast((err && err.code) === "declined" ? "Save cancelled."
        : "Saving is not available in this view. Use the command below instead.");
    }
    return;
  }
  localSave(`${MODEL.noun}.py`, script);
  toast(`${MODEL.noun}.py saved. Run it with build123d installed and it writes ${MODEL.noun}.step.`);
});
document.getElementById("export-json").addEventListener("click", async () => {
  const payload = JSON.stringify(
    {template: MODEL.templateId, [MODEL.variantKey]: variant, params: paramsOnly()}, null, 2);
  if (downloads) {
    try {
      await downloads.save({filename: `${stamp()}.json`, data: payload});
      toast("Parameters saved.");
    } catch (err) {
      toast((err && err.code) === "declined" ? "Save cancelled." : "Saving is not available in this view.");
    }
    return;
  }
  localSave(`${stamp()}.json`, payload);
  toast("Parameters saved.");
});
function paramsOnly() {
  const out = {};
  SCHEMA.forEach(f => out[f.k] = P[f.k]);
  out.seed = P.seed;
  return out;
}
document.getElementById("copy-cmd").addEventListener("click", async () => {
  const text = command();
  try {
    await navigator.clipboard.writeText(text);
    toast("Command copied. Run it in the repo to build this model for real.");
  } catch (err) {
    const range = document.createRange();
    range.selectNodeContents(document.getElementById("command"));
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
    toast("Press ⌘C / Ctrl+C to copy the selected command.");
  }
});

/* Switching models rebuilds the right-hand column from the new schema
   rather than hiding half of the old one: the panels, the chips and the
   sliders are all the model's own. */
function useModel(name) {
  MODEL = MODELS[name];
  SCHEMA = MODEL.schema;
  refit = true;
  variant = Object.keys(MODEL.presets)[0];
  P = Object.assign({}, MODEL.defaults, MODEL.presets[variant], {seed: MODEL.seed});
  document.getElementById("tagline").innerHTML = MODEL.tagline;
  document.getElementById("seed-note").innerHTML = MODEL.seedNote;
  document.getElementById("preset-heading").innerHTML =
    MODEL.presetHeading + ' <span id="species-name"></span>';
  buildTabs();
  buildChips();
  buildControls();
  setExportNote();
  syncInputs();
  rebuild();
}

/* =================================================================
   11. Boot
   ================================================================= */
function buildTabs() {
  const host = document.getElementById("tabs");
  host.innerHTML = "";
  Object.keys(MODELS).forEach(name => {
    const tab = document.createElement("button");
    tab.type = "button";
    tab.className = "tab";
    tab.setAttribute("role", "tab");
    tab.setAttribute("aria-selected", String(MODELS[name] === MODEL));
    tab.textContent = MODELS[name].title;
    tab.addEventListener("click", () => useModel(name));
    host.appendChild(tab);
  });
}
document.getElementById("pipeline").innerHTML =
  ["preset", "seed", "jitter", "proportions", "feasibility", "geometry"]
    .map((n, i) => (i ? '<i>&rarr;</i>' : "") + (i === 5 ? `<b>${n}</b>` : n)).join("");
const themeWatcher = window.matchMedia("(prefers-color-scheme: dark)");
themeWatcher.addEventListener("change", paintTheme);
new MutationObserver(paintTheme).observe(document.documentElement, {attributes: true, attributeFilter: ["data-theme"]});
paintTheme();
useModel("mushroom");
