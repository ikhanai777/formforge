id: planter_bamboo_culm
version: 1
category: planter
display_name: "Bamboo Culm Planter"
description: >
  Cylindrical planter styled as a cut bamboo culm: raised node collars at
  regular intervals, a subtle swell between them, and a drainage hole. The
  outer surface is a single revolve, so the theme is parametric rather than
  sculpted -- change the segment count and it is still bamboo.
tags: [planter, pot, bamboo, culm, cylinder, ribbed, botanical, zen, drainage, no-supports]
embedding_text: >
  bamboo planter bamboo culm pot bamboo themed planter segmented cylinder pot
  ribbed planter zen planter botanical pot asian planter cylinder planter
  bamboo vase stalk pot node ring planter
language: build123d
print_test:
  # No model in this repository has been physically printed. The target
  # machine and the rationale below are design intent, not a test record.
  status: untested
  target_printer: "Bambu P1S"
  target_material: PLA
  rationale: >
    The node collars are the only feature that could need support, so their
    undersides ramp outward over 1.3x their height -- about 35 degrees off
    vertical, measured at 34.5 on the default build. That is the whole reason
    the collar is a ramped ridge rather than a torus: a rounded bead would
    turn horizontal where it meets the culm and bridge badly at 0.4 mm.
    Defaults are deliberately slender (96 mm inner across 185 mm tall): at
    1:1 proportions the node rings read as a barrel, not bamboo.

expected_solids: 1

dimension_map:
  # Only height. `diameter_mm` is the inner cavity, so the bounding box is
  # wider than it by two walls plus two node collars -- mapping it to `width`
  # would hold the template to a number it never claimed to produce.
  height_mm: height

param_schema:
  type: object
  required: [diameter_mm, height_mm]
  properties:
    diameter_mm:
      type: number
      minimum: 60
      maximum: 200
      default: 96
      description: >
        Inner diameter at the rim. A 4 inch nursery pot needs about 110 mm to
        drop in with room for its rim; a 3 inch needs about 85 mm.
      ui: { widget: slider, step: 5, label: "Inner diameter" }
    height_mm:
      type: number
      minimum: 80
      maximum: 250
      default: 185
      description: "Bamboo needs height to read as bamboo. Below about 1.4x the diameter it looks like a barrel."
      ui: { widget: slider, step: 5, label: "Height" }
    segments:
      type: integer
      minimum: 2
      maximum: 8
      default: 4
      description: "Internode sections. The collars sit on the boundaries between them, so there are segments-1 rings."
      ui: { widget: slider, step: 1, label: "Segments" }
    node_h_mm:
      type: number
      minimum: 0.8
      maximum: 4.0
      default: 2.0
      description: "How far each node collar stands proud of the culm."
      ui: { widget: slider, step: 0.2, label: "Node relief" }
    node_w_mm:
      type: number
      minimum: 3.0
      maximum: 14.0
      default: 6.0
      description: "Axial width of the collar band."
      ui: { widget: slider, step: 0.5, label: "Node width" }
    bulge_mm:
      type: number
      minimum: 0
      maximum: 3.0
      default: 1.2
      description: "Swell at the midpoint of each internode. Set to 0 for a plain segmented cylinder."
      ui: { widget: slider, step: 0.2, label: "Internode swell" }
    wall_mm:
      type: number
      minimum: 2.0
      maximum: 4.5
      default: 2.8
      description: "Below 2.0 mm the pot weeps through the perimeter lines."
      ui: { widget: slider, step: 0.2, label: "Wall" }
    floor_mm:
      type: number
      minimum: 2.0
      maximum: 6
      default: 3.5
    taper_deg:
      type: number
      minimum: 0
      maximum: 8
      default: 0
      description: "Inward taper toward the base. Real culms are straight, so this defaults to 0."
      ui: { widget: slider, step: 1, label: "Taper" }
    drainage:
      type: string
      enum: [none, single_hole, triple_hole]
      default: single_hole
      ui: { widget: select, label: "Drainage" }
    drain_d_mm:
      type: number
      minimum: 5
      maximum: 20
      default: 10
    base_chamfer_mm:
      type: number
      minimum: 0
      maximum: 2
      default: 0.8

invariants:
  - "solids == 1"
  - "is_watertight"
  - "min_wall >= 2.0"
  - "trapped_volumes == 0"
  - "bbox.z <= height_mm * 1.02"
  - "plate_contact_fraction >= 0.3"
  # A tall culm that cannot stand up is not a planter.
  - "com_inside_footprint"
  # Drainage is required unless the user explicitly asked for a cachepot.
  - "drainage != 'none' implies hole_count >= 1"

preconditions:
  - "floor_mm < height_mm"
  - "wall_mm * 2 + 20 < diameter_mm"
  # Each collar has to fit inside its own internode with culm left either side.
  - "node_w_mm * 2 < height_mm / segments"
  # Ramp up (1.3x) plus fall away (0.6x) has to fit within the collar width.
  - "node_h_mm * 1.9 < node_w_mm"
  - "drainage != 'none' implies drain_d_mm + wall_mm * 4 < diameter_mm"

source: |
  from build123d import *
  import math

  DIAMETER_MM = 96.0
  HEIGHT_MM = 185.0
  SEGMENTS = 4
  NODE_H_MM = 2.0
  NODE_W_MM = 6.0
  BULGE_MM = 1.2
  WALL_MM = 2.8
  FLOOR_MM = 3.5
  TAPER_DEG = 0.0
  DRAINAGE = "single_hole"
  DRAIN_D_MM = 10.0
  BASE_CHAMFER_MM = 0.8

  R_RIM_MM = DIAMETER_MM / 2 + WALL_MM
  # Clamped on base radius, not on wall: a steep taper on a tall culm shrinks
  # the footprint until the pot will not stand, and the angle alone cannot see
  # that. Holding the base at 70% of the rim keeps plate contact above the
  # invariant at every combination of height and taper in range.
  TAPER_MM = min(
      HEIGHT_MM * math.tan(math.radians(TAPER_DEG)),
      R_RIM_MM * 0.30,
  )
  R_BASE_MM = R_RIM_MM - TAPER_MM
  SEG_H_MM = HEIGHT_MM / SEGMENTS
  # Points sampled along each internode curve. Enough that the swell reads as
  # a curve; few enough that the revolve stays cheap.
  STEPS = 8


  def radius_at(z):
      """Culm radius before node relief: linear taper plus the internode swell."""
      base = R_BASE_MM + (z / HEIGHT_MM) * (R_RIM_MM - R_BASE_MM)
      phase = (z % SEG_H_MM) / SEG_H_MM
      return base + BULGE_MM * math.sin(math.pi * phase)


  # The whole pot is one closed profile revolved about Z: outer culm up, across
  # the rim, back down the inside, in across the floor. One revolve of one
  # closed face cannot produce a shell that is not watertight.
  pts = [(0.0, 0.0)]
  if BASE_CHAMFER_MM > 0:
      pts.append((radius_at(0.0) - BASE_CHAMFER_MM, 0.0))
      pts.append((radius_at(BASE_CHAMFER_MM), BASE_CHAMFER_MM))
  else:
      pts.append((radius_at(0.0), 0.0))

  for k in range(1, int(SEGMENTS)):
      zc = k * SEG_H_MM
      z_start = zc - NODE_W_MM / 2
      prev = pts[-1][1]
      for i in range(1, STEPS + 1):
          z = prev + (z_start - prev) * i / STEPS
          pts.append((radius_at(z), z))
      # Underside ramps out over 1.3x the relief so it never needs support;
      # the top face falls away steeply, which costs nothing because nothing
      # is printed above it.
      z_up = z_start + NODE_H_MM * 1.3
      z_top = zc + NODE_W_MM / 2 - NODE_H_MM * 0.6
      z_end = zc + NODE_W_MM / 2
      pts.append((radius_at(z_up) + NODE_H_MM, z_up))
      pts.append((radius_at(z_top) + NODE_H_MM, z_top))
      pts.append((radius_at(z_end), z_end))

  prev = pts[-1][1]
  for i in range(1, STEPS + 1):
      z = prev + (HEIGHT_MM - prev) * i / STEPS
      pts.append((radius_at(z), z))

  pts.append((R_RIM_MM - WALL_MM, HEIGHT_MM))
  # The cavity ignores the collars and the swell, so the wall is thickest at
  # the nodes -- which is where a real culm is strongest too.
  pts.append((radius_at(FLOOR_MM) - WALL_MM - BULGE_MM, FLOOR_MM))
  pts.append((0.0, FLOOR_MM))

  with BuildPart() as culm:
      with BuildSketch(Plane.XZ) as profile:
          with BuildLine():
              Polyline(*pts, close=True)
          make_face()
      revolve(axis=Axis.Z)

      if DRAINAGE != "none":
          with BuildSketch(Plane.XY) as drain:
              if DRAINAGE == "single_hole":
                  Circle(DRAIN_D_MM / 2)
              else:
                  for k in range(3):
                      angle = k * 2.0943951023931953
                      offset = (radius_at(FLOOR_MM) - WALL_MM) * 0.45
                      with Locations(
                          (offset * math.cos(angle), offset * math.sin(angle))
                      ):
                          Circle(DRAIN_D_MM / 3)
          extrude(amount=FLOOR_MM, mode=Mode.SUBTRACT)

  result = culm.part
